[package]
name = "honk-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
honk-config.workspace = true
honk-ebpf-common.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
rand.workspace = true
uuid.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
shake.workspace = true
hmac.workspace = true
hkdf.workspace = true
boring.workspace = true
boring-sys.workspace = true
tokio-boring.workspace = true
brotli.workspace = true
webpki-root-certs.workspace = true
foreign-types.workspace = true
aes-gcm.workspace = true
aes.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
blake3.workspace = true
bytes.workspace = true
base64.workspace = true
anyhow.workspace = true
md-5.workspace = true
socket2.workspace = true
libc.workspace = true
parking_lot.workspace = true
lru.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# QUIC transport (TUIC / Hysteria2 / Juicity outbounds)
quinn.workspace = true
quinn-proto.workspace = true
# HTTP/2 client for the urltest latency probe (urltest.rs)
h2.workspace = true
http.workspace = true

[dev-dependencies]
chrono.workspace = true
rcgen.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
# rustls: test-only — loopback TLS/QUIC servers prove wire interop with the
# BoringSSL client stack (and cross-check the QUIC crypto backend)
tokio-rustls.workspace = true

[features]
# VLESS (xtls-rprx-vision flow) / VMess proxy handlers. Off by default:
# the descriptor facts stay unconditional, the registry simply has no
# handler to dispatch for those protocols without the feature.
rprx = []

[[bench]]
name = "ss_aead"
harness = false

[[example]]
name = "vmess_lab59"
required-features = ["rprx"]

[[example]]
name = "vless_bench"
required-features = ["rprx"]

[[example]]
name = "proto_bench"
required-features = ["rprx"]

[[example]]
name = "vless_transports"
required-features = ["rprx"]

[[bench]]
name = "group_selection"
harness = false

[[bench]]
name = "vless_vision"
harness = false
required-features = ["rprx"]
