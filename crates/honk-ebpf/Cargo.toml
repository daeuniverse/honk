
[package]
name = "honk-ebpf"
version = "0.0.1-alpha"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
aya-ebpf = "0.2"
aya-ebpf-bindings = "0.2"
aya-ebpf-cty = "0.3"
aya-log-ebpf = { version = "0", optional = true }
honk-ebpf-common = { path = "../honk-ebpf-common" }
network-types = "0.2.0"

[features]
default = []
log = ["aya-log-ebpf"]
routing-test = []

[[bin]]
name = "honk-ebpf"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 2
