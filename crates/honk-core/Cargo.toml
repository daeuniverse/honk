[package]
name = "honk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "honk_core"
path = "src/lib.rs"

[[bin]]
name = "honk-core"
path = "src/main.rs"
bench = false

[dependencies]
honk-config.workspace = true
honk-ebpf-common.workspace = true
honk-outbound.workspace = true
honk-nfqueue = { workspace = true, optional = true }

# eBPF (optional; enable with the `ebpf` feature)
aya = { workspace = true, optional = true }
aya-obj = { workspace = true, optional = true }
aya-log = { workspace = true, optional = true }

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# CLI
clap.workspace = true

# Config
toml.workspace = true

# Networking
reqwest.workspace = true
socket2.workspace = true
bytes.workspace = true
pin-project-lite.workspace = true

# musl's stock malloc is slow under contention (visible as ~8% malloc+lock
# time in perf); the `mimalloc` feature (default on) makes it the shipped
# binary's allocator. Build without default features for a stock-malloc
# binary.
mimalloc = { version = "0.1", optional = true }
# Same sys crate instance as mimalloc's (cargo feature unification), used by
# the Tokio worker idle hook to collect each owning heap.
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }

# Encoding
base64.workspace = true
percent-encoding = { workspace = true, optional = true }
aho-corasick.workspace = true

# DNS transports (DoH H2 / DoQ / DoH3)
h2.workspace = true
http.workspace = true
quinn.workspace = true
h3.workspace = true
h3-quinn.workspace = true

# Persistence (cache_file / cachedb)
rusqlite.workspace = true

# Misc
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
ipnet.workspace = true
rand.workspace = true
lru.workspace = true
libc.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
libsystemd.workspace = true
nix.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true

# Debug HTTP API / Clash API (both need axum; clash-api also needs ws)
axum = { workspace = true, optional = true, features = ["ws"] }
tower-http = { workspace = true, optional = true }

# External UI auto-download (clash-api)
zip = { workspace = true, optional = true }

[features]
default = ["clash-api", "mimalloc", "rprx"]
# Enable real eBPF support (requires Linux kernel 5.8+)
ebpf = ["aya", "aya-obj", "aya-log", "dep:honk-nfqueue"]
# Enable the Clash-compatible REST API (experimental.clash_api)
clash-api = ["dep:axum", "dep:tower-http", "dep:percent-encoding", "dep:zip"]
# Route the shipped binary's allocations through mimalloc (see main.rs)
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# VLESS / VMess proxy handlers (xtls-rprx-vision flow support)
rprx = ["honk-outbound/rprx"]
dns-bench = []
reload-bench = []
reload-alloc-bench = ["reload-bench"]
reload-bench-counters = ["reload-bench"]

[build-dependencies]
anyhow.workspace = true

[dev-dependencies]
# Test utilities
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio-tungstenite.workspace = true
rcgen.workspace = true
# rustls: test-only — mock TLS/QUIC servers prove interop with the BoringSSL client stack
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
futures-util = "0.3"
stats_alloc = "0.1.10"

[[bench]]
name = "dns"
harness = false
required-features = ["dns-bench"]

[[bench]]
name = "udp"
harness = false

[[bench]]
name = "reload"
harness = false
required-features = ["reload-bench"]
