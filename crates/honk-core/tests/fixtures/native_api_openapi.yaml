  /api/v1/dns/log:
    get:
      operationId: listDnsLog
      tags:
        - DNS
      summary: Read the bounded ring of recent resolutions
      description: |
        Requires resources.dns_log.available. Records client DNS resolutions,
        excluding diagnostic /dns/query calls, in a bounded in-memory ring.
        Results are newest first. The ring holds at most
        resources.dns_log.max_records and is cleared on restart.
        A limit above resources.dns_log.max_page_size returns 400 invalid_request.
        A cursor whose record has left the ring returns 410 snapshot_expired, as
        the Cursor parameter defines; restart from the newest page without a
        cursor.
        A page may hold fewer than limit records while next_cursor is
        non-null, for example when the server's response size limit ends it
        early. Only a null next_cursor ends the walk. A record whose answers
        alone exceed that limit is served whole on a page of its own, never
        clipped or refused.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          description: Case-insensitive substring of the question name.
          schema:
            type: string
            minLength: 1
          example: telegram
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DnsRecordType'
          example: A
        - name: src
          in: query
          description: Client source IP literal, IPv4 or IPv6.
          schema:
            type: string
            minLength: 1
          example: 10.0.0.12
        - name: limit
          in: query
          schema:
            $ref: '#/components/schemas/SafeUInt'
            minimum: 1
          example: 200
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Recent resolutions, newest first
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsLogList'
              examples:
                recent:
                  value:
                    observed_at: '2026-08-15T10:00:00Z'
                    total: 2
                    next_cursor: null
