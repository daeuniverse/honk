  /api/v1/rules:
    get:
      operationId: listRules
      tags:
        - Rules
      summary: Read the running generation's routing rules
      description: |
        Return one coherent, complete rule dictionary for the running routing generation,
        in evaluation order, including its fallback entry. This resource is read-only;
        it neither evaluates traffic nor reads back raw configuration. rule_id is identical
        to the ID used by POST /api/v1/routing/trace and FlowSummary.rule_id for the same
        generation. Join rules by generation_id and rule_id, never by expression or
        index alone. FlowSummary.rule_generation_id names the rule's generation; join
        a summary only when it equals generation_id, never when it is null.
        generation_id identifies the dictionary's routing generation. Refetch after
        generation.changed; do not join old flow evidence to a new generation.
        There is no paginated snapshot and no 410 snapshot_expired response. If a coherent
        generation cannot be pinned, return 503 snapshot_unavailable. resources.rules.max_rules
        is never below the running dictionary's size, so the complete dictionary is always
        returned and never truncated. expression follows the display rule in rules.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Ordered rules and fallback from one running generation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
              examples:
                running:
                  value:
                    generation_id: generation-42
                    rules:
                      - rule_id: traffic:0
                        index: 0
                        expression: pname(curl) -> direct
                        outbound: direct
                        must: false
                        source:
                          file: routing.dae
                          source_id: source-routing
                          line: 12
                          column: 5
                        kind: rule
                      - rule_id: traffic:1
                        index: 1
                        expression: dip(198.51.100.0/24) -> proxy
                        outbound: proxy
                        must: false
                        source:
                          file: routing.dae
                          source_id: source-routing
                          line: 13
                          column: 5
                        kind: rule
                      - rule_id: traffic:2
                        index: 2
                        expression: 'fallback: block'
                        outbound: block
                        must: false
                        source: null
                        kind: fallback
                    fallback:
                      outbound: block
                      source: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
