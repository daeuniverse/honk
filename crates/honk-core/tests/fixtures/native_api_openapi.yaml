components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer authentication is mandatory on every request except CORS preflights,
        discovery, and password setup and login whenever a deployment secret is set.
        Elsewhere the anonymous security alternative is permitted only on an explicitly
        secretless loopback listener, never as a fallback for invalid credentials.
        Discovery answers any request without a credential with its public view.
        Native permissions are expressed by x-permission; see API Configuration.
  headers:
    NoStore:
      description: Native responses are not cacheable.
      required: true
      schema:
        type: string
        const: no-store
    NoSniff:
      description: Prevent MIME-type sniffing.
      required: true
      schema:
        type: string
        const: nosniff
    ETag:
      description: Strong entity tag of the representation, the value a later If-Match compares.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    '0':
      name: type
      in: query
      schema:
        type: string
        enum:
          - tcp
          - udp
          - all
        default: all
    '1':
      name: src
      in: query
      description: Exact source IP literal, without a port; applied with type before limit. Totals and truncated describe only matching visible entries.
      schema:
        $ref: '#/components/schemas/IpAddress'
      example: 192.168.1.100
    Detail:
      name: detail
      in: query
      schema:
        type: string
        enum:
          - summary
          - full
        default: summary
      example: full
    Limit1000:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from the previous page's next_cursor, bound to the walk that
        issued it (its snapshot or retained records, filters and limit). An unrecognised
        cursor returns 410 snapshot_expired; see
        [Page cursors](/v0.1.0/en/docs/errors.html#Page-cursors).
      schema:
        type: string
        minLength: 1
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: group-proxy
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: tcp-01HZX4K8W5
    FlowId:
      name: flow_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: flow-23
    DnsEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: dns-entry-01HZX4K8W5
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: op-01HZX4K8W7
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Evaluated as RFC 9110 §13.1.1 defines; see Conditional requests in the error contract.
      schema:
        $ref: '#/components/schemas/EntityTagList'
      example: '"d1f62f00c6da9ec33956e66b8cc3b4670f164556fc12453193904af23451dec1"'
    IfMatchOptional:
      name: If-Match
      in: header
      description: Evaluated as RFC 9110 §13.1.1 defines; see Conditional requests in the error contract. For when a retained idempotent replay may omit it, see [Choosing the status](/v0.1.0/en/docs/errors.html#Choosing-the-status).
      schema:
        $ref: '#/components/schemas/EntityTagList'
      example: '"17"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Replay key for this operation, scoped to the running instance, caller,
        method and path. A byte-identical body returns the original response; a
        different body returns 409 idempotency_conflict. Only operations that list
        this header replay.
      schema:
        type: string
        minLength: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      example: instance-7:123
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: provider-a
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: node-hk-03
  responses:
    '404':
      description: Unknown source ID or unavailable configuration readback
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              value:
                error:
                  code: resource_not_found
                  message: Configuration source not found.
                request_id: request-source-1
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
            capability_not_supported:
              value:
                error:
                  code: capability_not_supported
                  message: Configuration readback is unavailable.
                request_id: request-source-2
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    OperationAccepted:
      description: Operation accepted
      headers:
        Location:
          description: Operation status URL; equal to body href.
          required: true
          schema:
            type: string
            pattern: ^/api/v1/operations/[^/]+$
        Retry-After:
          description: Positive polling floor in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationAccepted'
    BadRequest:
      description: Malformed parameters or request shape
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_request:
              value:
                error:
                  code: invalid_request
                  message: A request parameter is invalid.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Unauthorized:
      description: Credentials are missing or invalid
      headers:
        WWW-Authenticate:
          description: The authentication challenge (RFC 9110 §15.5.2); the native API uses the Bearer scheme.
          required: true
          schema:
            type: string
            pattern: ^Bearer(\s|$)
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            authentication_required:
              value:
                error:
                  code: authentication_required
                  message: Valid bearer credentials are required.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                WWW-Authenticate: Bearer
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Forbidden:
      description: The caller lacks the required permission, or listener security policy rejects the request.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            permission_denied:
              value:
                error:
                  code: permission_denied
                  message: The caller lacks the required permission.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    NotFound:
      description: Resource/action unavailable, absent, expired, or concealed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              value:
                error:
                  code: resource_not_found
                  message: The requested resource was not found.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
            capability_not_supported:
              value:
                error:
                  code: capability_not_supported
                  message: The requested resource or action is unavailable.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Conflict:
      description: State, idempotency, or cursor conflict
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            state_conflict:
              value:
                error:
                  code: state_conflict
                  message: The current state prevents this change.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Gone:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Flow retention expired (flow_expired)
    SnapshotExpired:
      description: The page cursor no longer names a retained snapshot or record; restart the walk without a cursor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            snapshot_expired:
              value:
                error:
                  code: snapshot_expired
                  message: The page snapshot expired; restart the page walk.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    TooLarge:
      description: Request size or advertised fan-out limit exceeded
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            request_too_large:
              value:
                error:
                  code: request_too_large
                  message: The request exceeds a size limit.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    UnsupportedMediaType:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Unsupported request Content-Type
    Unprocessable:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Unsupported field, value, or transition, or error diagnostics from configuration replacement validation
    PreconditionRequired:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Required If-Match is absent
    RateLimited:
      description: Advertised request or operation rate exceeded
      headers:
        Retry-After:
          description: Retry delay in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                error:
                  code: rate_limited
                  message: The request rate limit was reached.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Retry-After: 1
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Unavailable:
      description: Bounded queue or required runtime component unavailable
      headers:
        Retry-After:
          description: Retry delay in seconds when retryable.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            temporarily_unavailable:
              value:
                error:
                  code: temporarily_unavailable
                  message: A required runtime component is unavailable.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Retry-After: 1
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    SnapshotUnavailable:
      description: A coherent snapshot could not be pinned or held within its budget; retry after Retry-After.
      headers:
        Retry-After:
          description: Retry delay in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            snapshot_unavailable:
              value:
                error:
                  code: snapshot_unavailable
                  message: A coherent snapshot is unavailable; retry the read.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Retry-After: 1
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    ErrorResponseCommon:
      description: Native API error
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EventCursorExpired:
      description: Last-Event-ID cannot be replayed (event_cursor_expired); sent before any 200 stream opens. Drop the cursor, reconnect without it and establish a new baseline.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            event_cursor_expired:
              value:
                error:
                  code: event_cursor_expired
                  message: Event cursor is older than the retained window; reconnect without it.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
      maxProperties: 0
    SafeUInt:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    NullableSafeUInt:
      type:
        - integer
        - 'null'
      minimum: 0
      maximum: 9007199254740991
    UInt64:
      type: string
      maxLength: 20
      not:
        pattern: '[^0-9]'
      pattern: ^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)$
      description: Canonical unsigned 64-bit decimal string, 0 through 18446744073709551615. Never a JSON number.
    NullableUInt64:
      oneOf:
        - type: 'null'
        - $ref: '#/components/schemas/UInt64'
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    ErrorCode:
      type: string
      description: 'Closed catalogue of HTTP error codes. Adding a code changes the contract. Embedded errors such as operation.error, datapath.errors, last_reload.error, and provider.last_error use SafeError with engine-defined codes, except the shared activation outcome codes an engine uses for a failed configuration change when the case applies: reload_rejected, reload_degraded, supervisor_reconciliation_failed, activation_unconfirmed and store_unavailable.'
      enum:
        - invalid_request
        - authentication_required
        - permission_denied
        - resource_not_found
        - capability_not_supported
        - method_not_allowed
        - state_conflict
        - idempotency_conflict
        - event_cursor_expired
        - snapshot_unavailable
        - snapshot_expired
        - flow_expired
        - stale_revision
        - request_too_large
        - unsupported_media_type
        - unsupported_value
        - precondition_required
        - rate_limited
        - temporarily_unavailable
        - setup_required
        - setup_already_completed
        - invalid_credentials
    SafeError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type:
            - object
            - 'null'
      description: Safe structured error; never raw engine output.
    ApiError:
      allOf:
        - $ref: '#/components/schemas/SafeError'
        - type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
      description: HTTP error body; the code comes from ErrorCode.
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type:
            - string
            - 'null'
    Discovery:
      description: The full view for a caller the listener admits, or the public view for any other request without a credential.
      oneOf:
        - $ref: '#/components/schemas/AdmittedDiscovery'
        - $ref: '#/components/schemas/PublicDiscovery'
    AdmittedDiscovery:
      type: object
      required:
        - name
        - status
        - api_major
        - base_path
        - links
        - auth
      properties:
        name:
          type: string
          const: daeuniverse/native
        status:
          type: string
          const: draft
        api_major:
          type: integer
          const: 1
        base_path:
          type: string
          const: /api/v1
        links:
          type: object
          description: Shared links, plus an x-<engine> member for the engine's extension links (see capabilities, Engine extensions). Other members are not allowed.
          additionalProperties: false
          patternProperties:
            ^x-[a-z][a-z0-9]*$:
              type: object
              additionalProperties:
                type: string
                pattern: ^/api/v1/x-[a-z][a-z0-9]*/
          required:
            - version
            - capabilities
            - config
            - config_validate
            - runtime
            - runtime_outbounds
            - traffic_history
            - memory_history
            - logs
            - providers
            - rules
            - operations
            - geodata
          properties:
            version:
              type: string
              const: /api/v1/version
            capabilities:
              type: string
              const: /api/v1/capabilities
            config:
              type: string
              const: /api/v1/config
            config_validate:
              type: string
              const: /api/v1/config/validate
            runtime:
              type: string
              const: /api/v1/runtime
            runtime_outbounds:
              type: string
              const: /api/v1/runtime/outbounds
            traffic_history:
              type: string
              const: /api/v1/runtime/traffic/history
            memory_history:
              type: string
              const: /api/v1/runtime/memory/history
            logs:
              type: string
              const: /api/v1/logs
            providers:
              type: string
              const: /api/v1/providers
            rules:
              type: string
              const: /api/v1/rules
            geodata:
              type: string
              const: /api/v1/geodata
            operations:
              type: string
              const: /api/v1/operations/{operation_id}
            auth_setup:
              type:
                - string
                - 'null'
              enum:
                - /api/v1/auth/setup
                - null
              description: Present in password mode, null otherwise.
            auth_login:
              type:
                - string
                - 'null'
              enum:
                - /api/v1/auth/login
                - null
              description: Present in password mode, null otherwise.
            auth_logout:
              type:
                - string
                - 'null'
              enum:
                - /api/v1/auth/logout
                - null
              description: Present in password mode, null otherwise.
        auth:
          $ref: '#/components/schemas/AuthDiscovery'
    PublicDiscovery:
      type: object
      description: What a client needs before it signs in. Status, base path, resource links, `auth_logout` and `auth.anonymous_loopback` are withheld.
      additionalProperties: false
      required:
        - name
        - api_major
        - links
        - auth
      properties:
        name:
          type: string
          const: daeuniverse/native
        api_major:
          type: integer
          const: 1
        links:
          type: object
          additionalProperties: false
          required:
            - auth_setup
            - auth_login
          properties:
            auth_setup:
              type:
                - string
                - 'null'
              enum:
                - /api/v1/auth/setup
                - null
              description: Present in password mode, null otherwise.
            auth_login:
              type:
                - string
                - 'null'
              enum:
                - /api/v1/auth/login
                - null
              description: Present in password mode, null otherwise.
        auth:
          type: object
          additionalProperties: false
          required:
            - mode
            - setup_required
          properties:
            mode:
              type: string
              enum:
                - token
                - password
            setup_required:
              type: boolean
    AuthDiscovery:
      type: object
      description: How a client authenticates. `password` mode offers setup until an administrator exists and login afterwards; `token` mode takes a configured bearer, or none when `anonymous_loopback` admits loopback peers.
      required:
        - mode
        - setup_required
        - anonymous_loopback
      properties:
        mode:
          type: string
          enum:
            - token
            - password
        setup_required:
          type: boolean
        anonymous_loopback:
          type: boolean
    AuthCredentials:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 8 to 128 Unicode scalar values, at most 512 UTF-8 bytes; not normalised or trimmed.
    AuthSession:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          minLength: 1
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    Version:
      type: object
      required:
        - api
        - engine
      properties:
        api:
          type: object
          required:
            - name
            - major
            - status
          properties:
            name:
              type: string
              const: daeuniverse/native
            major:
              type: integer
              const: 1
            status:
              type: string
              const: draft
        engine:
          type: object
          required:
            - name
            - version
          properties:
            name:
              type: string
              pattern: ^[a-z][a-z0-9]*$
              maxLength: 32
              description: Lowercase engine name, such as dae or honk. It names the engine's x-<engine> extension members and routes.
            version:
              type: string
              minLength: 1
        build:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - revision
                - target
                - built_at
              properties:
                revision:
                  type:
                    - string
                    - 'null'
                target:
                  type:
                    - string
                    - 'null'
                built_at:
                  $ref: '#/components/schemas/NullableTimestamp'
    AvailableResource:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
    Capabilities:
      type: object
      required:
        - observed_at
        - profiles
        - limits
        - resources
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - base
              - full_transparency
        limits:
          type: object
          required:
            - max_request_target_bytes
            - max_header_bytes
            - max_json_body_bytes
          properties:
            max_request_target_bytes:
              type: integer
              minimum: 1
            max_header_bytes:
              type: integer
              minimum: 1
            max_json_body_bytes:
              type: integer
              minimum: 1
        resources:
          type: object
          description: Only runtime is required. An absent resource key means the resource is unavailable, exactly as available false does, so a server that predates a resource still validates. Engine-only resources go in an x-<engine> member; other unlisted keys are not allowed.
          required:
            - runtime
          additionalProperties: false
          patternProperties:
            ^x-[a-z][a-z0-9]*$:
              type: object
              description: The engine's extension resources, keyed by name. Each follows the rules for shared resource keys.
              additionalProperties:
                $ref: '#/components/schemas/AvailableResource'
          properties:
            config:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - writable
                  - max_bytes
                  - max_sources
              not:
                required:
                  - create
                  - writable
                properties:
                  create:
                    const: true
                  writable:
                    const: false
              properties:
                available:
                  type: boolean
                  description: Accepted-source readback is implemented. Every returned source carries its content.
                writable:
                  type: boolean
                  description: |
                    Server-wide switch for replacing accepted sources under control;
                    individual sources may still be read-only. True requires full
                    validation and reload operations, including resources.reload.available
                    and resources.operations.available. Independent of the optional
                    dry-run endpoint.
                create:
                  type: boolean
                  default: false
                  description: |
                    POST /config/sources is implemented: a control caller may add a new
                    source file that an include pattern loads. False by default; true
                    requires writable.
                max_bytes:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum UTF-8 bytes in replacement or new source content. At most limits.max_json_body_bytes minus the request envelope, which is the largest compact UTF-8 JSON encoding of the request body without its content, taking for POST the permitted path whose encoding is longest (each quotation mark or backslash in the path encodes to two bytes, so this exceeds the path's 1024-byte limit). Content that JSON escaping expands can still exceed limits.max_json_body_bytes, and that limit then applies.
                max_sources:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum complete effective source set the engine can expose; never silently truncate it.
            config_validate:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - modes
                  - max_bytes
                  - max_sources
              properties:
                available:
                  type: boolean
                modes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ConfigValidationMode'
                max_bytes:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum total UTF-8 configuration source bytes, including locally resolved source text in full mode. Geodata assets do not count toward this limit. The shared JSON body limit applies separately.
                max_sources:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum sources per validation, including local dependencies in full mode.
            runtime:
              $ref: '#/components/schemas/AvailableResource'
            runtime_memory:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - metrics
              properties:
                available:
                  type: boolean
                metrics:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - process.rss_bytes
                      - cgroup.current_bytes
                      - cgroup.limit_bytes
                      - cgroup.events.high
                      - cgroup.events.oom
                      - cgroup.events.oom_kill
                      - kernel.ebpf_bytes
            runtime_outbounds:
              $ref: '#/components/schemas/AvailableResource'
            traffic_history:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_window_seconds
                  - max_points
              properties:
                available:
                  type: boolean
                max_window_seconds:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
                max_points:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum returned samples per history request.
            memory_history:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_window_seconds
                  - max_points
              properties:
                available:
                  type: boolean
                max_window_seconds:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
                max_points:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum returned samples per history request.
            datapath:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - kinds
                  - details
              properties:
                available:
                  type: boolean
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DatapathKind'
                details:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - attachments
                      - maps
            nodes:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - can_manage
              properties:
                available:
                  type: boolean
                can_manage:
                  type: boolean
                  description: POST /nodes and DELETE /nodes/{node_id} are implemented for inline nodes; the engine owns a writable main source.
            providers:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - can_refresh
                  - can_manage
                  - max_page_size
              properties:
                available:
                  type: boolean
                can_refresh:
                  type: boolean
                  description: Refresh is implemented; individual provider kinds may still be unsupported. Requires operations.available.
                can_manage:
                  type: boolean
                  description: Supports creating subscription providers and deleting subscription or file providers from a writable managed main source.
                create_unfetched:
                  type: boolean
                  description: A created provider is not fetched until POST /providers/{provider_id}/refresh; it starts with node_count 0, updated_at null and status stale. False or absent means the engine may fetch it during activation and reports its actual state.
                create_options:
                  type: object
                  additionalProperties: false
                  description: Optional ProviderCreate fields the engine accepts, each with the value it applies when the field is omitted. A field not listed is unsupported. Absent means none are supported.
                  properties:
                    update_interval:
                      type: integer
                      minimum: 0
                      maximum: 31536000
                    user_agent:
                      type: string
                      minLength: 1
                    cache:
                      type: boolean
                max_page_size:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  maximum: 1000
            groups:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - config_patch
                  - selection
                  - max_patch_operations
              properties:
                available:
                  type: boolean
                config_patch:
                  type: boolean
                  description: PATCH /groups/{group_id}/config is implemented. A group patch is a configuration write, so true requires resources.config.writable.
                selection:
                  type: boolean
                max_patch_operations:
                  type: integer
                  minimum: 1
            probes:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - targets
                  - kinds
                  - transports
                  - ip_versions
                  - limits
              properties:
                available:
                  type: boolean
                targets:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - node
                      - group
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ProbeKind'
                transports:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Transport'
                ip_versions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/IpVersion'
                limits:
                  $ref: '#/components/schemas/ProbeLimits'
            connections:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - can_close
                  - max_bulk_close
              properties:
                available:
                  type: boolean
                can_close:
                  type: boolean
                  description: Whether userspace-owned connections can be closed; false makes both connection DELETE endpoints return 404 capability_not_supported.
                max_bulk_close:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum matching live entries, including non-closable entries, per bulk close; used only when can_close is true. Excess returns 413 request_too_large before any connection is closed.
            flows:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - recording
                  - scopes
                  - max_flows
                  - max_steps_per_flow
                  - retention_seconds
                  - snapshot_ttl_seconds
                  - max_page_size
              properties:
                available:
                  type: boolean
                recording:
                  type: string
                  enum:
                    - 'off'
                    - 'on'
                    - auto
                    - sampled
                  description: The engine's flow recording policy, not whether the recorder is capturing now. off records none, because the configuration does not permit the flow recorder or its mode is off; on records every flow in scopes (mode on); auto enables recording on client demand; sampled records a subset. recording.flows.active in GET /runtime/settings reports whether capture is active now.
                scopes:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/FlowScope'
                min_flows:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Smallest flows.max_flows a runtime-settings PATCH may set. Absent means 1.
                max_flows:
                  type: integer
                  minimum: 1
                  description: The largest flow capacity the engine supports, which is the most a runtime-settings PATCH may set, not the current value. The current value is flows.max_flows in GET /runtime/settings.
                max_steps_per_flow:
                  type: integer
                  minimum: 1
                retention_seconds:
                  type: integer
                  minimum: 1
                  description: The longest terminal-flow retention the engine supports, which is the most a runtime-settings PATCH may set, not the current value. The smallest a PATCH may set is always 1. The current value is flows.retention_seconds in GET /runtime/settings.
                snapshot_ttl_seconds:
                  type: integer
                  minimum: 1
                max_page_size:
                  type: integer
                  minimum: 1
                  maximum: 1000
            routing_trace:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - resolve_modes
                  - max_addresses
                  - max_rule_steps
                  - timeout_ms
                  - per_principal_requests_per_minute
                  - global_requests_per_minute
              properties:
                available:
                  type: boolean
                resolve_modes:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - none
                      - live
                max_addresses:
                  type: integer
                  minimum: 1
                max_rule_steps:
                  type: integer
                  minimum: 1
                timeout_ms:
                  type: integer
                  minimum: 1
                per_principal_requests_per_minute:
                  type: integer
                  minimum: 1
                global_requests_per_minute:
                  type: integer
                  minimum: 1
            rules:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_rules
              properties:
                available:
                  type: boolean
                max_rules:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum complete rule dictionary size, including the fallback entry; never below the running generation's size and never a truncation limit.
            events:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - kinds
                  - retention_seconds
                  - max_buffered_events
                  - max_clients
                  - heartbeat_seconds
              properties:
                available:
                  type: boolean
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/EventKind'
                retention_seconds:
                  type: integer
                  minimum: 0
                max_buffered_events:
                  type: integer
                  minimum: 1
                max_clients:
                  type: integer
                  minimum: 1
                heartbeat_seconds:
                  type: integer
                  minimum: 1
                  maximum: 15
            logs:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - levels
                  - filters
                  - retention_seconds
                  - max_buffered_records
              properties:
                available:
                  type: boolean
                levels:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/LogLevel'
                filters:
                  type: array
                  uniqueItems: true
                  description: The GET /logs query filters this engine applies. level is always listed; a filter not listed returns 422 unsupported_value.
                  items:
                    type: string
                    enum:
                      - level
                      - target
                  contains:
                    const: level
                retention_seconds:
                  type: integer
                  minimum: 1
                  description: Maximum age of a replayable record, in seconds. A resume cursor older than this returns 409 event_cursor_expired even when the ring has room.
                min_buffered_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Smallest log.buffered_records a runtime-settings PATCH may set. Absent means 1.
                max_buffered_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum permitted log replay-ring capacity. The current capacity is runtime settings log.buffered_records. Neither value guarantees retention duration.
            dns_query:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - record_types
                  - limits
              properties:
                available:
                  type: boolean
                record_types:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DnsRecordType'
                limits:
                  $ref: '#/components/schemas/DnsQueryLimits'
            dns_cache:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - read
                  - delete_entry
                  - delete_name
                  - flush
                  - entry_kinds
              properties:
                available:
                  type: boolean
                read:
                  type: boolean
                delete_entry:
                  type: boolean
                delete_name:
                  type: boolean
                flush:
                  type: boolean
                entry_kinds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - positive
                      - negative
            dns_log:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_records
                  - max_page_size
              properties:
                available:
                  type: boolean
                min_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Smallest dns_log.max_records a runtime-settings PATCH may set. Absent means 1.
                max_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum permitted DNS log-ring capacity. The current capacity is dns_log.max_records in GET /runtime/settings. Neither value guarantees retention duration.
                max_page_size:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
            dns_rules:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_rules
              properties:
                available:
                  type: boolean
                max_rules:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum size of each DNS rule list, including its fallback entry; never below either running list's size and never a truncation limit.
            runtime_settings:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - fields
              properties:
                available:
                  type: boolean
                fields:
                  type: array
                  uniqueItems: true
                  description: The settings PATCH /runtime/settings accepts on this engine; another field the schema defines returns 422.
                  items:
                    $ref: '#/components/schemas/RuntimeSettingField'
            geodata:
              type: object
              required:
                - available
              allOf:
                - if:
                    properties:
                      available:
                        const: true
                  then:
                    required:
                      - can_update
                      - assets
                - if:
                    required:
                      - can_update
                    properties:
                      can_update:
                        const: true
                  then:
                    required:
                      - checksum
                - if:
                    required:
                      - configurable_sources
                    properties:
                      configurable_sources:
                        const: true
                  then:
                    required:
                      - max_urls
                      - interval_hours
                      - checksum
                      - lifecycle
              properties:
                available:
                  type: boolean
                can_update:
                  type: boolean
                  description: POST /geodata/update is implemented. Requires operations.available and configured asset sources.
                assets:
                  type: array
                  uniqueItems: true
                  description: The asset kinds GET /geodata reports on this engine.
                  items:
                    $ref: '#/components/schemas/GeoAssetKind'
                configurable_sources:
                  type: boolean
                  description: Download URLs and automatic updates are managed through geodata in GET and PATCH /runtime/settings, and GET /geodata reports update status and required_codes. Requires runtime_settings.available with geodata in its fields. Absent means false.
                max_urls:
                  type: integer
                  minimum: 1
                  description: Most download URLs per asset a geodata patch may set. Required when configurable_sources is true.
                interval_hours:
                  type: object
                  additionalProperties: false
                  required:
                    - min
                    - max
                    - default
                  description: Bounds and default of geodata auto_update.interval_hours. Required when configurable_sources is true. min <= default <= max is required; JSON Schema cannot express this ordering, so validators check it separately.
                  properties:
                    min:
                      type: integer
                      minimum: 1
                    max:
                      type: integer
                      minimum: 1
                    default:
                      type: integer
                      minimum: 1
                checksum:
                  type:
                    - string
                    - 'null'
                  enum:
                    - sha256sum
                    - pinned
                    - null
                  description: How the engine verifies a download when verify_checksum is true. sha256sum appends .sha256sum to the URL path, keeping any query, and compares the SHA-256 the response names; a 404 means none is published. pinned compares with a SHA-256 the engine holds for the URL. Null means downloads are unverified. Required when can_update or configurable_sources is true.
                lifecycle:
                  type: object
                  additionalProperties: false
                  required:
                    - file_values
                    - overrides_persist
                  description: When geodata settings take configuration-file values and how long overrides last; see Geodata. Required when configurable_sources is true.
                  properties:
                    file_values:
                      type: string
                      enum:
                        - start
                        - activation
                      description: start takes file values at process start only; activation also takes them at each configuration activation.
                    overrides_persist:
                      type: boolean
                      description: True when a PATCH override lasts across restarts; false when it lasts until the process exits.
            operations:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - retention_seconds
              properties:
                available:
                  type: boolean
                retention_seconds:
                  type: integer
                  minimum: 0
                max_replay_keys:
                  type: integer
                  minimum: 1
                  description: Finished Idempotency-Key records the server keeps before the retention window ends. Beyond this count it may evict the oldest-finished first. Absent means none are evicted before the window ends. Keys of unfinished operations are never evicted.
            reload:
              $ref: '#/components/schemas/AvailableResource'
            suspend:
              $ref: '#/components/schemas/AvailableResource'
            resume:
              $ref: '#/components/schemas/AvailableResource'
    EffectiveConfig:
      type: object
      required:
        - generation_id
        - revision
        - sources
        - diagnostics
        - secrets_redacted
      properties:
        generation_id:
          type: string
          minLength: 1
          description: Running generation whose accepted sources and diagnostics are returned.
        revision:
          type: string
          minLength: 1
          description: Opaque configuration revision used by Runtime.generation.config_revision and GroupSummary.config_revision; preserve without numeric parsing.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSource'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDiagnostic'
        secrets_redacted:
          type: boolean
          description: True when a listener-secret value (the deployment secret of an API listener) was masked somewhere in this response. Content, paths and diagnostics are otherwise returned in the clear to an admitted request.
    ConfigSourceContent:
      type: object
      description: One accepted source's identity and content, the representation GET /config/sources/{source_id} returns. Every field stays the same while the source bytes do, so content_sha256 can serve as its entity tag.
      required:
        - id
        - path
        - kind
        - content_sha256
        - bytes
        - content
        - line_count
      properties:
        id:
          type: string
          minLength: 1
          description: Unique opaque source ID within this configuration snapshot; never a credential-bearing path or URL.
        path:
          type: string
          minLength: 1
          description: The path relative to the entry directory, as the configuration references it; not a file-access capability.
        absolute_path:
          type: string
          minLength: 1
          description: The file's absolute path on the engine host.
        kind:
          type: string
          enum:
            - main
            - include
            - subscription
            - generated
        content_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
          description: Lowercase SHA-256 of the accepted source bytes before redaction; not necessarily the digest of displayed content.
        bytes:
          $ref: '#/components/schemas/SafeUInt'
          description: Accepted source size in bytes before redaction.
        content:
          type: string
          description: Accepted engine-native text with listener-secret values masked. Use for editing only if its UTF-8 SHA-256 matches content_sha256.
        line_count:
          $ref: '#/components/schemas/SafeUInt'
          description: Lines in the accepted source before redaction; empty text has zero lines, and a final newline does not add an empty line.
    ConfigSource:
      description: A source entry of GET /config, ConfigSourceContent plus the fields that can change without the bytes changing.
      allOf:
        - $ref: '#/components/schemas/ConfigSourceContent'
        - type: object
          required:
            - writable
            - loaded_at
          properties:
            writable:
              type: boolean
              description: |
                True only when server-wide editing is enabled and this source permits
                replacement by a control caller. False for engine-written includes,
                generated sources, and subscriptions, for a source that holds API
                listener settings or secrets, and while the configuration store
                cannot accept writes; observe alone never grants writes.
            read_only_reason:
              type: string
              enum:
                - writes_disabled
                - store_blocked
                - listener_secret_source
                - listener_secret_in_content
              description: |
                Present only while writable is false and one of these causes applies,
                naming the first that does in this order. Describes the accepted
                snapshot. writes_disabled: config_write is off or no secret or
                password_auth is configured. store_blocked: a failed db record blocks
                writes until the head revision is activated again.
                listener_secret_source: the source declares a native or Clash listener
                secret. listener_secret_in_content: the source text contains a
                listener secret value.
            loaded_at:
              $ref: '#/components/schemas/Timestamp'
              description: Time these source bytes were accepted, not the current file modification time.
          if:
            properties:
              kind:
                enum:
                  - subscription
                  - generated
            required:
              - kind
          then:
            properties:
              writable:
                const: false
    ConfigSourceCreate:
      type: object
      additionalProperties: false
      required:
        - path
        - content
      properties:
        path:
          type: string
          minLength: 5
          maxLength: 1024
          pattern: ^(?!/)(?!.*//)(?!(?:.*/)?\.\.?(?:/|$))[^\u0000-\u001f\u007f-\u009f]*\.dae$
          description: New file path relative to the main source's directory, as ConfigSource.path reports it. Normal segments only, ending in .dae, at most 1024 UTF-8 bytes, no control characters. An include pattern of the resulting source set must match it.
        content:
          type: string
          description: Complete UTF-8 engine-native text; empty text is validated, not rejected as malformed.
    ConfigDiagnostic:
      type: object
      required:
        - level
        - source_id
        - line
        - column
        - span
        - code
        - message
      description: |
        Safe diagnostic for an accepted or candidate source, never raw parser output.
        Coordinates refer to the original source before redaction. Use null for
        unknown locations; do not fabricate positions from setting names.
      properties:
        level:
          type: string
          enum:
            - error
            - warning
            - info
        source_id:
          type: string
          minLength: 1
          description: Source ID in the effective snapshot, validation request, or source set being validated for replacement.
        line:
          $ref: '#/components/schemas/NullableSafeUInt'
          minimum: 1
          description: One-based line, or null if unknown.
        column:
          $ref: '#/components/schemas/NullableSafeUInt'
          minimum: 1
          description: One-based UTF-8 byte column, or null if unknown; not a character or UTF-16 offset.
        span:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConfigDiagnosticSpan'
        code:
          type: string
          minLength: 1
          description: Engine-defined diagnostic code, independent of the HTTP ErrorCode catalogue.
        message:
          type: string
          minLength: 1
          description: Safe operator-facing description; never source excerpts, listener secrets or raw engine errors. See the visibility table in api-config.
    ConfigDiagnosticSpan:
      type: object
      required:
        - start_line
        - start_column
        - end_line
        - end_column
      description: |
        One-based lines and UTF-8 byte columns; start inclusive, end exclusive.
        The end must not precede the start. A zero-width span is permitted.
        When line and column are known, they equal the span start.
      properties:
        start_line:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        start_column:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        end_line:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        end_column:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
    ConfigDiagnosticsErrorResponse:
      description: unsupported_value error whose details.diagnostics holds at least one error-level diagnostic.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              required:
                - details
              properties:
                code:
                  const: unsupported_value
                details:
                  type: object
                  required:
                    - diagnostics
                  properties:
                    diagnostics:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConfigDiagnostic'
                      contains:
                        type: object
                        required:
                          - level
                        properties:
                          level:
                            const: error
    ConfigValidationMode:
      type: string
      enum:
        - syntax
        - full
    ConfigValidationSource:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.-]+$
          description: Request-local diagnostic ID of 1 to 128 ASCII letters, digits, `.`, `_` or `-`. If omitted, use source-N where N is the one-based array index; all effective IDs must be unique. Never put secrets in IDs.
        path:
          type: string
          minLength: 1
          description: Optional engine-native source name and include-resolution base within the engine's authorized local roots; never grants arbitrary file access.
        content:
          type: string
          description: Candidate engine-native source text; empty text is a candidate, not a malformed request.
    ConfigValidationRequest:
      type: object
      additionalProperties: false
      required:
        - sources
        - mode
      properties:
        sources:
          type: array
          minItems: 1
          description: Ordered candidate sources; the first is the main source. Supplied content takes precedence over local files at the same resolved path.
          items:
            $ref: '#/components/schemas/ConfigValidationSource'
        mode:
          $ref: '#/components/schemas/ConfigValidationMode'
    ConfigValidationResult:
      type: object
      required:
        - valid
        - diagnostics
        - generation_id
        - validated_at
      properties:
        valid:
          type: boolean
          description: True when validation completes without error diagnostics. Successful validation does not guarantee a later apply will succeed.
        diagnostics:
          type: array
          description: Source IDs identify submitted sources. Attribute a dependency failure to the referring submitted source and its include/subscription location.
          items:
            $ref: '#/components/schemas/ConfigDiagnostic'
        generation_id:
          type: string
          minLength: 1
          description: Running generation captured when validation starts, for context only; not a new candidate generation or an apply precondition.
        validated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time validation completed.
      if:
        properties:
          valid:
            const: true
      then:
        properties:
          diagnostics:
            not:
              contains:
                properties:
                  level:
                    const: error
                required:
                  - level
      else:
        properties:
          diagnostics:
            contains:
              properties:
                level:
                  const: error
              required:
                - level
    ProbeLimits:
      type: object
      required:
        - max_members_per_job
        - max_results_per_job
        - max_active_jobs
        - max_queued_jobs
        - max_concurrent_per_target
        - job_timeout_ms
        - per_principal_requests_per_minute
        - global_requests_per_minute
      properties:
        max_members_per_job:
          type: integer
          minimum: 1
        max_results_per_job:
          type: integer
          minimum: 1
        max_active_jobs:
          type: integer
          minimum: 1
        max_queued_jobs:
          type: integer
          minimum: 0
        max_concurrent_per_target:
          type: integer
          minimum: 1
        job_timeout_ms:
          type: integer
          minimum: 1
        per_principal_requests_per_minute:
          type: integer
          minimum: 1
        global_requests_per_minute:
          type: integer
          minimum: 1
    DnsQueryLimits:
      type: object
      required:
        - max_types_per_request
        - query_timeout_ms
        - max_response_bytes
        - per_principal_requests_per_minute
        - global_requests_per_minute
      properties:
        max_types_per_request:
          type: integer
          minimum: 1
        query_timeout_ms:
          type: integer
          minimum: 1
        max_response_bytes:
          type: integer
          minimum: 1
        per_principal_requests_per_minute:
          type: integer
          minimum: 1
        global_requests_per_minute:
          type: integer
          minimum: 1
    Runtime:
      type: object
      required:
        - observed_at
        - instance_id
        - lifecycle
        - generation
        - datapath
        - traffic
        - process
        - last_reload
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        instance_id:
          type: string
          minLength: 1
        lifecycle:
          type: object
          required:
            - state
            - started_at
            - uptime_seconds
          properties:
            state:
              type: string
              enum:
                - starting
                - running
                - reloading
                - suspended
                - draining
                - degraded
                - failed
            started_at:
              $ref: '#/components/schemas/NullableTimestamp'
            uptime_seconds:
              $ref: '#/components/schemas/NullableUInt64'
        generation:
          type: object
          required:
            - active_id
            - config_revision
            - state
            - activated_at
          properties:
            active_id:
              type: string
              minLength: 1
            config_revision:
              type:
                - string
                - 'null'
            state:
              type: string
              enum:
                - active
                - reloading
            activated_at:
              $ref: '#/components/schemas/NullableTimestamp'
        datapath:
          $ref: '#/components/schemas/DatapathSummary'
        traffic:
          $ref: '#/components/schemas/TrafficSummary'
        process:
          type: object
          required:
            - cpu_percent
          properties:
            pid:
              type:
                - integer
                - 'null'
              minimum: 0
              maximum: 4294967295
            cpu_percent:
              type:
                - number
                - 'null'
              minimum: 0
              description: CPU time the engine process used over the server's latest sampling interval, as a percentage of one CPU. 100 means one core fully busy; the value may exceed 100 on multi-core hosts. Null until two samples exist or when unmeasurable.
        last_reload:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LastReload'
        degradations:
          type: array
          maxItems: 64
          description: Features running reduced after a failure the engine recovered from. An absent or empty list means none are known. Codes are engine-defined like other SafeError codes. A change to the list is announced by runtime.updated.
          items:
            allOf:
              - $ref: '#/components/schemas/SafeError'
              - type: object
                required:
                  - component
                  - since
                properties:
                  component:
                    type: string
                    minLength: 1
                    description: Engine-defined feature identifier, such as persistence or pname_routing. Stable across releases of one engine; each component appears at most once.
                  since:
                    $ref: '#/components/schemas/Timestamp'
                    description: When the feature started running reduced. A failure that repeats while the entry is listed keeps the original time.
    LastReload:
      type: object
      required:
        - operation_id
        - status
        - finished_at
        - error
      properties:
        operation_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - succeeded
            - failed
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeError'
    TrafficSummary:
      type: object
      required:
        - scope
        - observed_by
        - counter_since
        - sampled_at
        - connections
        - bytes
        - rates
      properties:
        scope:
          type: string
          const: visible
        observed_by:
          $ref: '#/components/schemas/ObservedBy'
        counter_since:
          $ref: '#/components/schemas/NullableTimestamp'
        sampled_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Traffic sample timestamp, or null when unavailable. Never substitute the HTTP snapshot timestamp.
        connections:
          type: object
          required:
            - tcp
            - udp
            - total
          properties:
            tcp:
              $ref: '#/components/schemas/NullableSafeUInt'
            udp:
              $ref: '#/components/schemas/NullableSafeUInt'
            total:
              $ref: '#/components/schemas/NullableSafeUInt'
        bytes:
          type: object
          required:
            - upload
            - download
          properties:
            upload:
              $ref: '#/components/schemas/NullableUInt64'
            download:
              $ref: '#/components/schemas/NullableUInt64'
        rates:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - window_seconds
                - upload_bytes_per_second
                - download_bytes_per_second
              properties:
                window_seconds:
                  type: number
                  exclusiveMinimum: 0
                  description: Duration of the rate interval ending at sampled_at, in seconds.
                upload_bytes_per_second:
                  $ref: '#/components/schemas/NullableUInt64'
                download_bytes_per_second:
                  $ref: '#/components/schemas/NullableUInt64'
    RuntimeMemory:
      type: object
      required:
        - observed_at
        - process
        - cgroup
        - kernel
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        process:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                rss_bytes:
                  $ref: '#/components/schemas/NullableUInt64'
        cgroup:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - scope
              properties:
                scope:
                  type: string
                  enum:
                    - service
                    - shared
                    - unknown
                current_bytes:
                  $ref: '#/components/schemas/NullableUInt64'
                limit_bytes:
                  $ref: '#/components/schemas/NullableUInt64'
                events:
                  oneOf:
                    - type: 'null'
                    - type: object
                      properties:
                        high:
                          $ref: '#/components/schemas/NullableUInt64'
                        oom:
                          $ref: '#/components/schemas/NullableUInt64'
                        oom_kill:
                          $ref: '#/components/schemas/NullableUInt64'
        kernel:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - sampled_at
              properties:
                ebpf_bytes:
                  $ref: '#/components/schemas/NullableUInt64'
                sampled_at:
                  $ref: '#/components/schemas/NullableTimestamp'
    RuntimeOutbounds:
      type: object
      required:
        - observed_at
        - counter_since
        - outbounds
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        counter_since:
          $ref: '#/components/schemas/Timestamp'
          description: Shared cumulative counter reset boundary; changes on restart or reset. Never compute deltas across this boundary.
        outbounds:
          type: array
          items:
            $ref: '#/components/schemas/OutboundCounters'
    OutboundCounters:
      type: object
      required:
        - name
        - kind
        - active_connections
        - total_connections
        - upload_bytes
        - download_bytes
        - errors
      properties:
        name:
          type: string
          minLength: 1
          description: Engine-visible outbound name, retained with its counters across reloads.
        kind:
          type: string
          enum:
            - group
            - node
            - builtin
          description: Configured group, leaf node, or engine builtin such as direct/block.
        active_connections:
          $ref: '#/components/schemas/SafeUInt'
          description: Currently active connections attributed to this outbound.
        total_connections:
          $ref: '#/components/schemas/UInt64'
          description: Cumulative connections attributed to this outbound since counter_since.
        upload_bytes:
          $ref: '#/components/schemas/UInt64'
        download_bytes:
          $ref: '#/components/schemas/UInt64'
        errors:
          $ref: '#/components/schemas/UInt64'
          description: Cumulative outbound failures since counter_since; policy blocks are not errors.
    TrafficHistory:
      type: object
      required:
        - observed_at
        - window_seconds
        - sampled_every_seconds
        - samples
      description: |
        Samples lie in (observed_at - window_seconds, observed_at], oldest first.
        Retention is bounded by age and capacity and is cleared on process restart.
        Return fewer points for short retention, or an empty array before sampling.
        If needed, select every Nth stored sample backwards from the newest to
        fit max_points; preserve original timestamps and rates, without interpolation.
        Choose the smallest positive N that fits the point limit. A cumulative
        counter reset makes the spanning rate sample null, never a spike.
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        window_seconds:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
          description: Requested look-back window, not the age of the oldest retained sample.
        sampled_every_seconds:
          type: number
          exclusiveMinimum: 0
          description: Nominal interval between returned samples after thinning, or the recorder interval for an empty result; not the rate averaging interval.
        samples:
          type: array
          description: At most max_points retained samples; missed intervals remain gaps, never fabricated zero traffic.
          items:
            $ref: '#/components/schemas/TrafficHistorySample'
    TrafficHistorySample:
      type: object
      required:
        - sampled_at
        - upload_bytes_per_second
        - download_bytes_per_second
        - connections
      properties:
        sampled_at:
          $ref: '#/components/schemas/Timestamp'
          description: Original sample timestamp, never the HTTP snapshot time.
        upload_bytes_per_second:
          $ref: '#/components/schemas/NullableUInt64'
        download_bytes_per_second:
          $ref: '#/components/schemas/NullableUInt64'
        connections:
          $ref: '#/components/schemas/NullableSafeUInt'
          description: Visible active TCP and UDP connections at sampled_at, or null when unavailable.
    MemoryHistory:
      type: object
      required:
        - observed_at
        - window_seconds
        - sampled_every_seconds
        - samples
      description: |
        Samples lie in (observed_at - window_seconds, observed_at], oldest first,
        with the same retention, thinning, and gap rules as TrafficHistory.
        History covers process.rss_bytes, cgroup.current_bytes, and optionally
        kernel.ebpf_bytes, using resources.runtime_memory.metrics to determine support.
        Required metrics are null when unadvertised or unobservable.
        kernel_ebpf_bytes may be omitted when unadvertised.
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        window_seconds:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
          description: Requested look-back window, not the age of the oldest retained sample.
        sampled_every_seconds:
          type: number
          exclusiveMinimum: 0
          description: Nominal interval between returned samples after thinning, or the recorder interval for an empty result.
        samples:
          type: array
          description: At most max_points retained samples; missed intervals remain gaps.
          items:
            $ref: '#/components/schemas/MemoryHistorySample'
    MemoryHistorySample:
      type: object
      required:
        - sampled_at
        - rss_bytes
        - cgroup_current_bytes
      properties:
        sampled_at:
          $ref: '#/components/schemas/Timestamp'
          description: Original sample timestamp, never the HTTP snapshot time.
        rss_bytes:
          $ref: '#/components/schemas/NullableUInt64'
          description: Process resident set at sampled_at, or null when unavailable.
        cgroup_current_bytes:
          $ref: '#/components/schemas/NullableUInt64'
          description: cgroup memory.current at sampled_at, or null when unavailable.
        kernel_ebpf_bytes:
          $ref: '#/components/schemas/NullableUInt64'
          description: Kernel eBPF memory at sampled_at; omitted or null when unadvertised.
    DatapathKind:
      type: string
      enum:
        - ebpf
        - userspace
        - mock
        - unknown
    DatapathState:
      type: string
      enum:
        - active
        - degraded
        - detached
        - failed
        - disabled
        - unknown
    Visibility:
      type: string
      enum:
        - full
        - partial
        - none
    ObservedBy:
      type: string
      enum:
        - userspace
        - ebpf
        - mixed
    EbpfRoutingSummary:
      type: object
      required:
        - state
        - generation_id
      properties:
        state:
          type: string
          enum:
            - published
            - not_published
            - error
            - unknown
        generation_id:
          type:
            - string
            - 'null'
        epoch:
          type:
            - string
            - 'null'
    EbpfSummary:
      type: object
      required:
        - backend
        - programs
        - hooks
        - routing
        - health
        - last_error
        - checked_at
      properties:
        backend:
          type: string
          enum:
            - real
            - mock
            - unknown
        programs:
          type: string
          enum:
            - loaded
            - not_loaded
            - error
            - unknown
        hooks:
          type: string
          enum:
            - attached
            - partially_attached
            - detached
            - unknown
        routing:
          $ref: '#/components/schemas/EbpfRoutingSummary'
        health:
          type: string
          enum:
            - healthy
            - degraded
            - failed
            - unknown
        last_error:
          type:
            - string
            - 'null'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
    DatapathSummary:
      type: object
      required:
        - kind
        - state
        - visibility
        - ebpf
      properties:
        kind:
          $ref: '#/components/schemas/DatapathKind'
        state:
          $ref: '#/components/schemas/DatapathState'
        visibility:
          $ref: '#/components/schemas/Visibility'
        ebpf:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/EbpfSummary'
    Datapath:
      type: object
      required:
        - observed_at
        - kind
        - state
        - visibility
        - ebpf
        - errors
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        kind:
          $ref: '#/components/schemas/DatapathKind'
        state:
          $ref: '#/components/schemas/DatapathState'
        visibility:
          $ref: '#/components/schemas/Visibility'
        ebpf:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/EbpfDetail'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SafeError'
    EbpfDetail:
      allOf:
        - $ref: '#/components/schemas/EbpfSummary'
        - type: object
          required: []
          properties:
            attachments:
              type: array
              description: The attachments the engine checks. The list may be partial; an engine need not report every program it attached.
              items:
                $ref: '#/components/schemas/EbpfAttachment'
            maps:
              $ref: '#/components/schemas/EbpfMaps'
    EbpfAttachment:
      type: object
      required:
        - name
        - kind
        - state
      description: One program attachment. An interface attachment names the interface and direction, a cgroup attachment names the cgroup, and any other attachment, such as a sockmap verdict or a tracing program, describes its hook in `hook`.
      properties:
        name:
          type: string
          minLength: 1
          description: Program or hook name.
        kind:
          type: string
          enum:
            - interface
            - cgroup
            - other
        interface:
          type: string
          minLength: 1
        direction:
          type: string
          enum:
            - ingress
            - egress
        cgroup:
          type: string
          minLength: 1
          description: cgroup v2 path relative to the cgroup2 mount; / is the root cgroup.
        hook:
          type: string
          minLength: 1
          description: Where an `other` attachment is attached, in the engine's words, such as the sockmap a verdict program serves or the kernel function a tracing program hooks.
        state:
          type: string
          enum:
            - attached
            - detached
            - error
            - unknown
      allOf:
        - if:
            properties:
              kind:
                const: interface
          then:
            required:
              - interface
              - direction
            properties:
              cgroup: false
              hook: false
        - if:
            properties:
              kind:
                const: cgroup
          then:
            required:
              - cgroup
            properties:
              interface: false
              direction: false
              hook: false
        - if:
            properties:
              kind:
                const: other
          then:
            required:
              - hook
            properties:
              interface: false
              direction: false
              cgroup: false
    EbpfMaps:
      type: object
      required:
        - state
        - conn_state
      properties:
        state:
          type: string
          enum:
            - ready
            - partial
            - error
            - unknown
        conn_state:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MapOccupancy'
    MapOccupancy:
      type: object
      required:
        - occupancy
        - capacity
        - occupancy_known
      properties:
        occupancy:
          $ref: '#/components/schemas/NullableSafeUInt'
        capacity:
          $ref: '#/components/schemas/SafeUInt'
        occupancy_known:
          type: boolean
      if:
        properties:
          occupancy_known:
            const: true
      then:
        properties:
          occupancy:
            $ref: '#/components/schemas/SafeUInt'
      else:
        properties:
          occupancy:
            type: 'null'
    Transport:
      type: string
      enum:
        - tcp
        - udp
    IpVersion:
      type: string
      enum:
        - ipv4
        - ipv6
    HealthObservation:
      type: object
      required:
        - transport
        - purpose
        - ip_version
        - warmth
        - measurement
        - sample_source
        - state
        - latency_ms
        - moving_avg_ms
        - avg10_ms
        - observed_at
        - error
      properties:
        transport:
          $ref: '#/components/schemas/Transport'
        purpose:
          type: string
          enum:
            - data
            - dns
            - shared
        ip_version:
          $ref: '#/components/schemas/IpVersion'
        warmth:
          type: string
          enum:
            - cold
            - warm
            - mixed
            - unknown
        measurement:
          type: string
          enum:
            - tcp_connect
            - http_headers
            - http_round_trip
            - dns_round_trip
            - quic_handshake
            - mixed
            - unknown
        sample_source:
          type: string
          enum:
            - probe
            - traffic
            - restored
            - derived
            - mixed
            - unknown
        state:
          type: string
          enum:
            - healthy
            - unavailable
            - unknown
        latency_ms:
          type:
            - number
            - 'null'
          minimum: 0
        moving_avg_ms:
          type:
            - number
            - 'null'
          minimum: 0
        avg10_ms:
          type:
            - number
            - 'null'
          minimum: 0
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type:
            - string
            - 'null'
      allOf:
        - if:
            properties:
              state:
                enum:
                  - unavailable
                  - unknown
          then:
            properties:
              latency_ms:
                type: 'null'
    Node:
      type: object
      required:
        - id
        - name
        - protocol
        - subscription_tag
        - group_ids
        - health
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        protocol:
          type:
            - string
            - 'null'
        subscription_tag:
          type:
            - string
            - 'null'
        provider_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: Provider identity from GET /providers; omitted or null when provenance is unavailable. Never infer it from the node name.
        group_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        health:
          type: array
          description: Latest observations, unique by (transport, purpose, measurement, ip_version, warmth) within this node.
          items:
            $ref: '#/components/schemas/HealthObservation'
    NodeList:
      type: object
      required:
        - observed_at
        - nodes
        - next_cursor
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          type:
            - string
            - 'null'
    Provider:
      type: object
      required:
        - id
        - name
        - kind
        - url_redacted
        - node_count
        - updated_at
        - expires_at
        - traffic
        - status
        - last_error
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque provider identity, shared with Node.provider_id; not a URL or display name.
        name:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - subscription
            - file
            - inline
        url_redacted:
          type:
            - string
            - 'null'
          minLength: 1
          description: The configured source URL as written, with only listener-secret values masked; subscription credentials in it are returned. Null for file/inline sources. The wire name is kept for compatibility.
        node_count:
          $ref: '#/components/schemas/SafeUInt'
        updated_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Last successful load or refresh, or null if unknown or never loaded.
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Provider-reported expiry, or null when unavailable.
        traffic:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProviderTraffic'
        status:
          type: string
          enum:
            - ok
            - stale
            - error
          description: ok means current usable data is loaded. stale means the provider has not been fetched or retains older usable data. error means a failed load left no usable data.
        last_error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeError'
          description: The last failure, or null. A subscription fetch whose download route has no usable node yet reports code route_unavailable; other fetch failures report fetch_failed.
        download:
          description: The route a subscription's fetches take, with the values of the geodata download route. routing follows the routing rules like user traffic, group always goes through the group in group_id, and direct connects straight to the host. group_id is null for routing and direct and for a group that no longer exists. Null for file and inline providers. Engines that fetch subscriptions only directly omit it.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/GeoDataDownload'
      description: Provider metadata, visible as the visibility table in api-config describes. url_redacted is the configured URL with only listener-secret values masked; last_error is safe text without raw configuration.
    ProviderTraffic:
      type: object
      required:
        - upload_bytes
        - download_bytes
        - total_bytes
      properties:
        upload_bytes:
          $ref: '#/components/schemas/NullableUInt64'
        download_bytes:
          $ref: '#/components/schemas/NullableUInt64'
        total_bytes:
          $ref: '#/components/schemas/NullableUInt64'
          description: Provider-reported total traffic allowance, not upload plus download. Null if unknown or unlimited.
      description: Provider-reported usage, not runtime counters. Each unavailable quantity is null; traffic itself may be null when no usage metadata exists.
    ProviderList:
      type: object
      required:
        - providers
        - next_cursor
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        next_cursor:
          type:
            - string
            - 'null'
          minLength: 1
    ProviderRefreshAccepted:
      allOf:
        - $ref: '#/components/schemas/OperationAccepted'
        - type: object
          properties:
            kind:
              const: provider_refresh
    ProviderRefreshSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: provider_refresh
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/Provider'
            error:
              type: 'null'
    ProviderCreateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: provider_create
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/Provider'
            error:
              type: 'null'
    ProviderDeleteSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: provider_delete
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/DeleteCount'
            error:
              type: 'null'
    NodeCreateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: node_create
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/Node'
            error:
              type: 'null'
    NodeDeleteSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: node_delete
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/DeleteCount'
            error:
              type: 'null'
    ProviderCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
        - url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_.-]+$
          description: The subscription tag as written in the configuration; unique among providers.
        kind:
          type: string
          const: subscription
        url:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^https?://
          description: Fetched by the engine on refresh and stored in the managed main source; returned in url_redacted as written, apart from listener secrets.
        update_interval:
          type: integer
          minimum: 0
          maximum: 31536000
          description: Seconds between automatic refreshes; 0 refreshes only on request.
        user_agent:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[\x20-\x7E]+$
          description: User-Agent header sent when fetching the URL.
        cache:
          type: boolean
          description: Keep the last fetched body so the provider loads without the network at startup. false keeps none and removes a kept one.
    NodeCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - link
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The node name as written in the configuration; unique among inline nodes.
        link:
          type: string
          minLength: 1
          maxLength: 8192
          description: A share link in a scheme the engine parses (for example vless, vmess, trojan, ss); stored in the managed main source, whose text returns it as written.
    GeoAssetKind:
      type: string
      enum:
        - geosite
        - geoip
    GeoAsset:
      type: object
      required:
        - kind
        - sha256
        - size_bytes
        - modified_at
        - source_redacted
      properties:
        kind:
          $ref: '#/components/schemas/GeoAssetKind'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Digest of the loaded file.
        size_bytes:
          $ref: '#/components/schemas/UInt64'
        modified_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Modification time of the loaded file, or null when the filesystem does not report one.
        source_redacted:
          type:
            - string
            - 'null'
          minLength: 1
          description: Display-only download source, in the display form described in Geodata; query removed and credential-shaped path segments replaced with [redacted]. With several configured URLs, the first. Null when no source is configured or the URL does not parse, including a URL with userinfo or a fragment.
        fetched_url_redacted:
          type:
            - string
            - 'null'
          minLength: 1
          description: Display-only URL the loaded file was downloaded from, in the same display form as source_redacted and null under the same conditions. Null when the engine did not download the loaded file, for example a file installed by a package. Reported when resources.geodata.configurable_sources is true.
        verified:
          type: boolean
          description: The loaded file was downloaded and matched the checksum found by the resources.geodata.checksum method for its download URL. False when no checksum was found, the method is null, verification was off, or the engine did not download the file. Reported when resources.geodata.configurable_sources is true.
        download_route:
          description: The route the loaded file was downloaded through. route is the GeoDataSettings.download route in force for that download. group_id is the group the request went through, the one the routing rules chose for route routing, and null for direct, for routing rules that chose direct or a single node, and for a group that no longer exists. Null when the engine did not download the loaded file. Reported when resources.geodata.configurable_sources is true.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/GeoDataDownload'
      dependentRequired:
        fetched_url_redacted:
          - verified
          - download_route
        verified:
          - fetched_url_redacted
        download_route:
          - fetched_url_redacted
    GeoData:
      type: object
      required:
        - observed_at
        - assets
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/GeoAsset'
        last_checked_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When the last update attempt, manual or automatic, finished, whatever its outcome. Null before the first.
        last_updated_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When an update last replaced a loaded file. Null before the first.
        next_check_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When the next automatic update is due, including its random delay and any failure backoff. Null while automatic updates are off.
        last_error:
          description: Why the last attempt failed after every URL was tried, with an engine-defined code. Null after a successful or unchanged attempt, and before the first.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeError'
        required_codes:
          type: object
          description: For each kind in resources.geodata.assets, the lowercase category names the active configuration references, sorted and without attribute suffixes. A replacement file must contain all of them.
          propertyNames:
            $ref: '#/components/schemas/GeoAssetKind'
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
      description: The update status fields and required_codes are reported together, when resources.geodata.configurable_sources is true.
      dependentRequired:
        last_checked_at:
          - last_updated_at
          - next_check_at
          - last_error
          - required_codes
        last_updated_at:
          - last_checked_at
        next_check_at:
          - last_checked_at
        last_error:
          - last_checked_at
        required_codes:
          - last_checked_at
    GeoDataUpdateAccepted:
      allOf:
        - $ref: '#/components/schemas/OperationAccepted'
        - type: object
          properties:
            kind:
              const: geodata_update
    GeoDataUpdateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: geodata_update
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/GeoData'
            error:
              type: 'null'
    GeoDataSettingsSource:
      type: string
      enum:
        - config
        - override
        - default
      description: Where the effective URL lists came from. config when every list that is not built in comes from the configuration file. override when a PATCH set at least one list that is still in force, even to the URLs the file names. default when both assets use the engine's built-in URLs. An asset with neither a file value nor an override uses its built-in URLs under any source. A PATCH may set URLs under any source.
    GeoDataUrl:
      type: string
      format: uri
      maxLength: 4096
      pattern: ^https?://(?![^/?#]*@)[^#]*$
      description: Absolute HTTP(S) URL without userinfo or fragment, fetched under the outbound-request policy in api-config. The engine does not follow redirects.
    GeoDataSources:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          minItems: 1
          uniqueItems: true
          description: Download URLs in fallback order, at most resources.geodata.max_urls. Returned as written, with only listener-secret values masked, to every admitted caller; see the visibility table in api-config.
          items:
            $ref: '#/components/schemas/GeoDataUrl'
    GeoDataAutoUpdate:
      type: object
      required:
        - enabled
        - interval_hours
      properties:
        enabled:
          type: boolean
          default: true
          description: Update on a schedule. On by default.
        interval_hours:
          type: integer
          minimum: 1
          description: Hours between automatic updates, within resources.geodata.interval_hours, whose default applies when nothing is set. The engine may add a random delay; next_check_at reports the result.
    GeoDataDownloadRoute:
      type: string
      enum:
        - routing
        - group
        - direct
      description: How geodata downloads leave the device. routing follows the routing rules like user traffic, so a rule can send them to a node, a group, direct or block. group always goes through the group in group_id. direct connects straight to the host, outside the routing rules.
    GeoDataDownload:
      type: object
      required:
        - route
        - group_id
      properties:
        route:
          $ref: '#/components/schemas/GeoDataDownloadRoute'
        group_id:
          type:
            - string
            - 'null'
          minLength: 1
          description: The group for route group, as in GET /groups. Null for routing and direct, and when the stored group no longer exists; downloads then fail until the route is changed.
    GeoDataDownloadPatch:
      type: object
      additionalProperties: false
      required:
        - route
      properties:
        route:
          $ref: '#/components/schemas/GeoDataDownloadRoute'
        group_id:
          type: string
          minLength: 1
          description: A current group id; required for route group and not allowed otherwise.
      if:
        properties:
          route:
            const: group
      then:
        required:
          - group_id
      else:
        not:
          required:
            - group_id
    GeoDataSettings:
      type: object
      required:
        - source
        - geosite
        - geoip
        - auto_update
        - download
      properties:
        source:
          $ref: '#/components/schemas/GeoDataSettingsSource'
          description: Read-only; a patch cannot set it.
        geosite:
          $ref: '#/components/schemas/GeoDataSources'
        geoip:
          $ref: '#/components/schemas/GeoDataSources'
        auto_update:
          $ref: '#/components/schemas/GeoDataAutoUpdate'
        download:
          $ref: '#/components/schemas/GeoDataDownload'
          default:
            route: routing
            group_id: null
          description: The route every geodata request takes. routing when nothing is stored, as for every download the engine makes itself. When the engine takes file values (resources.geodata.lifecycle.file_values), a route the configuration file names replaces a stored one, and a route an earlier file set returns to routing when the file names none; a patched route is kept. It does not affect source. A group that has no usable member when an update runs, for example just after startup before its health checks finish, fails that URL like a connection error; the engine tries the next URL and reports last_error, and never falls back to direct.
        verify_checksum:
          type: boolean
          description: Whether an update verifies each file by the resources.geodata.checksum method and rejects a file that does not match. true when nothing is set, and an engine that omits the field behaves as true. false sends no checksum request and accepts the file unverified, with verified false, for a mirror that answers the checksum URL with an error page or a status other than 404.
    GeoDataSourcesPatch:
      type: object
      additionalProperties: false
      required:
        - urls
      properties:
        urls:
          type: array
          minItems: 1
          uniqueItems: true
          description: Replaces the whole list; order is fallback order. At most resources.geodata.max_urls; a longer list returns 400.
          items:
            $ref: '#/components/schemas/GeoDataUrl'
    GeoDataSettingsPatch:
      description: Merged into the current settings as overrides. A patch with geosite or geoip overrides only that list, so source becomes override, under any source; the other list is unchanged. auto_update, download and verify_checksum are each overridden on their own. null removes every override and every value taken from the configuration file until the engine next takes file values.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            geosite:
              $ref: '#/components/schemas/GeoDataSourcesPatch'
            geoip:
              $ref: '#/components/schemas/GeoDataSourcesPatch'
            download:
              $ref: '#/components/schemas/GeoDataDownloadPatch'
            verify_checksum:
              type: boolean
            auto_update:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled:
                  type: boolean
                interval_hours:
                  type: integer
                  minimum: 1
                  description: Within resources.geodata.interval_hours; a value outside it returns 400.
    GroupPolicy:
      type: object
      required:
        - kind
        - native
      properties:
        kind:
          type: string
          enum:
            - selector
            - urltest
            - loadbalance
            - fallback
            - random
            - score
            - fixed
        native:
          type: string
          minLength: 1
    GroupPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - native
      properties:
        kind:
          type: string
          enum:
            - selector
            - urltest
            - loadbalance
            - fallback
            - random
            - score
            - fixed
        native:
          type: string
          minLength: 1
    GroupMember:
      type: object
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - node
            - group
    GroupConfigDocument:
      type: object
      description: The group's policy and configured options, the target document of PATCH /groups/{group_id}/config.
      required:
        - policy
        - config
      properties:
        policy:
          $ref: '#/components/schemas/GroupPolicy'
        config:
          $ref: '#/components/schemas/GroupConfig'
    GroupConfig:
      type: object
      description: The group's own configured options, patched through PATCH /groups/{group_id}/config. For an option the engine supports, null means the group sets no value of its own and the engine's inheritance and defaults apply. Engine-only options go in a nested x-<engine> member, for example config["x-dae"].check_addresses; GET reports these members and they are not patch targets. Other unlisted keys are not allowed.
      required:
        - default_member_id
        - final_outbound
        - check_url
        - check_interval
        - tolerance
        - idle_timeout
        - interrupt_connections
      additionalProperties: false
      patternProperties:
        ^x-[a-z][a-z0-9]*$:
          type: object
          description: The engine's own group options, keyed by name. GET reports them; PATCH does not address them.
      properties:
        default_member_id:
          type:
            - string
            - 'null'
        final_outbound:
          type:
            - string
            - 'null'
        check_url:
          description: The one health-check URL. Engines probe this URL only; there is no list of URLs.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeHttpUrl'
        check_interval:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Configured health-check interval in seconds. An engine that runs checks on one global interval may keep this value without applying it.
        tolerance:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Minimum latency improvement in milliseconds before a URLTest group switches members.
        idle_timeout:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Inactivity in seconds after which a URLTest group counts as idle.
        interrupt_connections:
          type:
            - boolean
            - 'null'
          description: Whether changing the selection closes connections through the previous member. Null means the group sets no value of its own, or the engine has no such option.
    SafeHttpUrl:
      type: string
      format: uri
      pattern: ^https?://(?![^/?#]*@)
      description: Absolute HTTP(S) URL without userinfo, checked under the outbound-request policy in api-config.
    GroupSelection:
      type: object
      required:
        - member_id
        - source
      properties:
        member_id:
          type: string
          minLength: 1
        resolved_leaf_node_id:
          type:
            - string
            - 'null'
        source:
          type: string
          minLength: 1
          description: How the member was chosen. `override` while a pinned member stands in for an automatic policy; other values (health, runtime, policy, ...) are the engine's own.
    GroupRanking:
      type: object
      required:
        - metric
        - recovery_penalty_ms
        - group_offset_ms
        - score
        - reason
      properties:
        metric:
          type:
            - string
            - 'null'
        recovery_penalty_ms:
          type:
            - number
            - 'null'
        group_offset_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        reason:
          type:
            - string
            - 'null'
    GroupHealthObservation:
      allOf:
        - $ref: '#/components/schemas/HealthObservation'
        - type: object
          required:
            - member_id
            - sorting_latency_ms
            - ranking
          properties:
            member_id:
              type: string
              minLength: 1
            resolved_leaf_node_id:
              type:
                - string
                - 'null'
            sorting_latency_ms:
              type:
                - number
                - 'null'
            ranking:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupRanking'
    GroupRuntime:
      type: object
      required:
        - selection
        - health
      properties:
        selection:
          type: object
          required:
            - tcp
            - udp
          properties:
            tcp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
            udp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
        health:
          type: array
          items:
            $ref: '#/components/schemas/GroupHealthObservation'
    GroupCapabilities:
      type: object
      required:
        - can_select
        - can_override
        - supports_nested_groups
        - mutable_config
        - probe_transports
      properties:
        can_select:
          type: boolean
          description: The policy is a manual selector; PUT selection replaces its choice.
        can_override:
          type: boolean
          description: The policy chooses automatically but accepts a pinned member; PUT selection pins, DELETE selection returns to automatic.
        supports_nested_groups:
          type: boolean
        mutable_config:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
