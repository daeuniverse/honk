        node_id:
          type: string
          minLength: 1
    GroupProbeTarget:
      type: object
      required:
        - type
        - group_id
      properties:
        type:
          type: string
          const: group
        group_id:
          type: string
          minLength: 1
    ProbeTargetResponse:
      oneOf:
        - $ref: '#/components/schemas/NodeProbeTarget'
        - $ref: '#/components/schemas/GroupProbeTarget'
    ProbeMembers:
      oneOf:
        - type: string
          enum:
            - direct
            - leaves
        - type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    ProbeRequest:
      type: object
      description: 'The schema does not restrict kind and transport combinations. tcp_connect and http run over tcp; dns runs over tcp, udp or both. Any other combination parses and returns 422 unsupported_value. The kind fixes the health purpose that results report: tcp_connect and http test data, dns tests dns.'
      additionalProperties: false
      required:
        - target
        - kind
        - transport
        - ip_version
        - warmth
      properties:
        target:
          $ref: '#/components/schemas/ProbeTarget'
        kind:
          $ref: '#/components/schemas/ProbeKind'
        transport:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Transport'
        ip_version:
          type: string
          enum:
            - ipv4
            - ipv6
            - any
        members:
          $ref: '#/components/schemas/ProbeMembers'
          default: direct
        warmth:
          type: string
          enum:
            - cold
            - warm
      allOf:
        - if:
            properties:
              target:
                properties:
                  type:
                    const: node
                required:
                  - type
          then:
            not:
              required:
                - members
    ProbeResultItem:
      type: object
      required:
        - member_id
        - resolved_leaf_node_id
        - kind
        - purpose
        - transport
        - ip_version
        - warmth
        - state
        - latency_ms
        - health_updated
        - error
        - observed_at
      properties:
        member_id:
          type: string
          minLength: 1
        resolved_leaf_node_id:
          type:
            - string
            - 'null'
        kind:
          $ref: '#/components/schemas/ProbeKind'
        purpose:
          type: string
          enum:
            - data
            - dns
        transport:
          $ref: '#/components/schemas/Transport'
        ip_version:
          $ref: '#/components/schemas/IpVersion'
        warmth:
          type: string
          enum:
            - cold
            - warm
            - unknown
        state:
          type: string
          enum:
            - healthy
            - unavailable
            - unknown
        latency_ms:
          type:
            - number
            - 'null'
          minimum: 0
        health_updated:
          type: boolean
        error:
          type:
            - string
            - 'null'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                enum:
                  - unavailable
                  - unknown
          then:
            properties:
              latency_ms:
                type: 'null'
    ProbeResult:
      type: object
      required:
        - target
        - selection_changed
        - selection_before
        - selection_after
        - results
      properties:
        target:
          $ref: '#/components/schemas/ProbeTargetResponse'
        selection_changed:
