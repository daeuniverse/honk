              schema:
                $ref: '#/components/schemas/RuntimeSettings'
              examples:
                current:
                  value:
                    observed_at: '2026-08-15T10:00:00Z'
                    source: config
                    log:
                      level: info
                      buffered_records: 4096
                    dns_log:
                      max_records: 2048
                    flows:
                      max_flows: 10000
