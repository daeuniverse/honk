          $ref: '#/components/schemas/TraceStatus'
        input:
          $ref: '#/components/schemas/FlowInput'
    FlowCoverage:
      type: object
      required:
        - userspace_tcp
        - userspace_udp
        - kernel_direct
        - kernel_block
        - dns_intercept
        - kernel_bypass
      properties:
        userspace_tcp:
          $ref: '#/components/schemas/Visibility'
        userspace_udp:
          $ref: '#/components/schemas/Visibility'
        kernel_direct:
          $ref: '#/components/schemas/Visibility'
        kernel_block:
          $ref: '#/components/schemas/Visibility'
        dns_intercept:
          $ref: '#/components/schemas/Visibility'
        kernel_bypass:
          $ref: '#/components/schemas/Visibility'
    FlowList:
      type: object
      required:
        - instance_id
        - observed_at
        - coverage
        - dropped_records
        - flows
        - next_cursor
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        coverage:
          $ref: '#/components/schemas/FlowCoverage'
        dropped_records:
          $ref: '#/components/schemas/NullableUInt64'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowSummary'
        next_cursor:
          type:
            - string
            - 'null'
    FlowDetail:
      allOf:
        - $ref: '#/components/schemas/FlowSummary'
        - type: object
          required:
            - input
            - trace
          properties:
            input:
              $ref: '#/components/schemas/FlowInput'
            trace:
              $ref: '#/components/schemas/FlowTrace'
          not:
            required:
              - mode
        - oneOf:
            - required:
                - trace_status
              properties:
                trace_status:
                  const: complete
                trace:
                  properties:
                    status:
                      const: complete
            - required:
                - trace_status
              properties:
                trace_status:
                  const: partial
                trace:
                  properties:
                    status:
                      const: partial
            - required:
                - trace_status
              properties:
                trace_status:
                  const: disabled
                trace:
                  properties:
                    status:
                      const: disabled
      description: Recorded evidence identified by id and instance_id; never a simulation.
    FlowTrace:
      type: object
      required:
        - status
        - missing
        - steps
      properties:
        status:
          $ref: '#/components/schemas/TraceStatus'
        missing:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - not_instrumented
              - started_late
              - buffer_overflow
              - sampled
              - redacted
              - evicted
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStep'
      if:
        properties:
          status:
            const: complete
      then:
        properties:
          missing:
            maxItems: 0
          steps:
            items:
              properties:
                evidence:
                  const: observed
              if:
                properties:
                  stage:
                    const: route
              then:
                properties:
                  data:
                    properties:
                      input:
                        type: object
      else:
        properties:
          missing:
            minItems: 1
    FlowStep:
      oneOf:
        - $ref: '#/components/schemas/InputStep'
        - $ref: '#/components/schemas/RouteStep'
        - $ref: '#/components/schemas/DatapathStep'
        - $ref: '#/components/schemas/DialModeStep'
        - $ref: '#/components/schemas/DnsStep'
        - $ref: '#/components/schemas/RerouteStep'
        - $ref: '#/components/schemas/OutboundStep'
        - $ref: '#/components/schemas/ConnectionStep'
      discriminator:
        propertyName: stage
        mapping:
          input: '#/components/schemas/InputStep'
          route: '#/components/schemas/RouteStep'
          datapath: '#/components/schemas/DatapathStep'
          dial_mode: '#/components/schemas/DialModeStep'
          dns: '#/components/schemas/DnsStep'
          reroute: '#/components/schemas/RerouteStep'
          outbound: '#/components/schemas/OutboundStep'
          connection: '#/components/schemas/ConnectionStep'
    InputStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: input
            data:
              $ref: '#/components/schemas/InputStepData'
    InputStepData:
      type: object
      required:
        - values
        - source
      properties:
        values:
          allOf:
            - $ref: '#/components/schemas/FlowInput'
            - type: object
              required:
                - pname
              properties:
                pname:
                  type:
                    - string
                    - 'null'
        source:
          type: string
          enum:
            - kernel
            - socket
            - sniffer
            - dns_mapping
    RouteStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: route
            data:
              $ref: '#/components/schemas/RouteStepData'
    RouteStepData:
      type: object
      required:
        - evaluation_id
        - chain
        - plane
        - rule_id
        - rules
        - outbound
        - must
        - mark
        - input
        - dns_action
      properties:
        evaluation_id:
          type: string
          minLength: 1
        chain:
          type: string
          enum:
            - traffic
            - dns_request
            - dns_response
            - dns_upstream
        plane:
          type: string
          enum:
            - kernel
            - userspace
        rule_id:
          type:
            - string
            - 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
        outbound:
          type:
            - string
            - 'null'
          description: Traffic outbound, or DNS upstream tag for upstream/requery; null for other DNS actions.
        must:
          type:
            - boolean
            - 'null'
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
        input:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Immutable inputs consumed by this evaluation, typed by chain below; null means missing capture.
        dns_action:
          type:
            - string
            - 'null'
          enum:
            - upstream
            - asis
            - accept
            - reject
            - requery
            - null
      allOf:
        - oneOf:
            - required:
                - chain
              properties:
                chain:
                  enum:
                    - traffic
                    - dns_upstream
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/TrafficRoutingInput'
                dns_action:
                  type: 'null'
            - required:
                - chain
              properties:
                chain:
                  const: dns_request
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/DnsRequestRoutingInput'
                dns_action:
                  enum:
                    - upstream
                    - asis
                    - reject
                    - null
                must:
                  type: 'null'
                mark:
                  type: 'null'
            - required:
                - chain
              properties:
                chain:
                  const: dns_response
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/DnsResponseRoutingInput'
                dns_action:
                  enum:
                    - accept
                    - reject
                    - requery
                    - null
                must:
                  type: 'null'
                mark:
                  type: 'null'
        - if:
            properties:
              dns_action:
                enum:
                  - asis
                  - accept
                  - reject
          then:
            properties:
              outbound:
                type: 'null'
    DatapathStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: datapath
            data:
              $ref: '#/components/schemas/DatapathStepData'
    DatapathStepData:
      type: object
      required:
        - plane
        - action
        - reason
        - error
      properties:
        plane:
          type: string
          enum:
            - kernel
            - userspace
        action:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: pass lets the packet continue without the proxy, redirect hands it to the userspace proxy, hold keeps it until a pending decision completes, and drop discards it. Any other value is an engine-defined step documented with that engine; clients show an unknown value as it is.
        reason:
          type: string
          minLength: 1
        error:
          type:
            - string
            - 'null'
    DialModeStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: dial_mode
            data:
              $ref: '#/components/schemas/DialModeStepData'
    DialModeStepData:
      type: object
      required:
        - configured
        - effective_target
        - domain
        - domain_source
        - verification
        - reason
      properties:
        configured:
          type: string
          minLength: 1
        effective_target:
          type: string
          enum:
            - ip
            - domain
            - none
            - unknown
        domain:
          type:
            - string
            - 'null'
        domain_source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DomainSource'
        verification:
          type: string
          enum:
            - matched
            - other_family_trusted
            - failed
            - not_required
            - unavailable
        reason:
          type: string
          minLength: 1
    DnsStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: dns
            data:
              $ref: '#/components/schemas/DnsStepData'
    DnsStepData:
      type: object
      required:
        - lookup_id
        - parent_lookup_id
        - attempt_id
        - purpose
        - name
        - qtype
        - source
        - upstream_transport
        - carrier_transport
        - cache
        - cache_entry_id
        - upstream
        - route_evaluation_ids
        - status
        - addresses
        - selected_ip
        - error
      properties:
        lookup_id:
          type: string
          minLength: 1
        parent_lookup_id:
          type:
            - string
            - 'null'
        attempt_id:
          type:
            - string
            - 'null'
        purpose:
          type: string
          enum:
            - domain_verification
            - dial_target
            - proxy_server
            - intercepted_query
            - family_preference
            - refresh
        name:
          type: string
          minLength: 1
        qtype:
          $ref: '#/components/schemas/DnsRecordType'
        source:
          type: string
          enum:
            - hosts
            - cache
            - upstream
            - coalesced
            - unknown
        upstream_transport:
          type:
            - string
            - 'null'
          enum:
            - udp
            - tcp
            - dot
            - doh
            - doq
            - doh3
            - null
        carrier_transport:
          type:
            - string
            - 'null'
          enum:
            - tcp
            - udp
            - null
        cache:
          type: string
          enum:
            - hit
            - miss
            - stale
            - bypass
            - unknown
        cache_entry_id:
          type:
            - string
            - 'null'
        upstream:
          type:
            - string
            - 'null'
        route_evaluation_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        status:
          type: string
          minLength: 1
        addresses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IpAddress'
        selected_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        error:
          type:
            - string
            - 'null'
    RerouteStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: reroute
            data:
              $ref: '#/components/schemas/RerouteStepData'
    RerouteStepData:
      type: object
      required:
        - performed
        - reason
        - from_evaluation_id
        - to_evaluation_id
      properties:
        performed:
          type:
            - boolean
            - 'null'
        reason:
          type: string
          minLength: 1
        from_evaluation_id:
          type:
            - string
            - 'null'
        to_evaluation_id:
          type:
            - string
            - 'null'
    OutboundStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: outbound
            data:
              $ref: '#/components/schemas/OutboundStepData'
    OutboundStepData:
      type: object
      required:
        - attempt_id
        - parent_attempt_id
        - kind
        - evaluation_id
        - routing_source
        - routed_outbound
        - effective_outbound
        - selection_path
        - leaf_node_id
        - leaf_node_name
        - target
        - target_kind
        - dial_ip
        - server_addr
        - resolution_location
        - status
        - error
      properties:
        attempt_id:
          type: string
          minLength: 1
        parent_attempt_id:
          type:
            - string
            - 'null'
        kind:
          type: string
          enum:
            - leaf
            - transport
        evaluation_id:
          type:
            - string
            - 'null'
          minLength: 1
        routing_source:
          type: string
          enum:
            - evaluation
            - forced
            - builtin
            - unknown
        routed_outbound:
          type:
            - string
            - 'null'
        effective_outbound:
          type:
            - string
            - 'null'
        selection_path:
          type: array
          items:
            $ref: '#/components/schemas/SelectionPathItem'
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        target:
          type:
            - string
            - 'null'
        target_kind:
          type: string
          enum:
            - ip
            - domain
            - none
            - unknown
        dial_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        server_addr:
          type:
            - string
            - 'null'
        resolution_location:
          type: string
          enum:
            - original_ip
            - local_dns
            - outbound_remote
            - not_applicable
            - unknown
        status:
          type: string
          enum:
            - started
            - succeeded
            - failed
            - cancelled
        error:
          type:
            - string
            - 'null'
      if:
        properties:
          routing_source:
            const: evaluation
      then:
        properties:
          evaluation_id:
            type: string
      else:
        properties:
          evaluation_id:
            type: 'null'
    SelectionPathItem:
      type: object
      required:
        - group_id
        - member_id
        - member_name
        - policy
        - reason
        - selection
      properties:
        group_id:
          type: string
          minLength: 1
        member_id:
          type:
            - string
            - 'null'
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        policy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        selection:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SelectionDecision'
    SelectionDecision:
      type: object
      required:
        - previous_member_id
        - metric
        - tolerance_ms
        - candidates
      properties:
        previous_member_id:
          type:
            - string
            - 'null'
        metric:
          type:
            - string
            - 'null'
        tolerance_ms:
          type:
            - number
            - 'null'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SelectionCandidate'
    SelectionCandidate:
      type: object
      required:
        - member_id
        - member_name
        - leaf_node_id
        - leaf_node_name
        - eligible
        - sorting_latency_ms
        - score
        - selected
        - reason
      properties:
        member_id:
          type: string
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        eligible:
          type:
            - boolean
            - 'null'
        sorting_latency_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        selected:
          type: boolean
        reason:
          type: string
          minLength: 1
    ConnectionStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: connection
            data:
              $ref: '#/components/schemas/ConnectionStepData'
    ConnectionStepData:
      type: object
      required:
        - state
        - reason
        - milestone
        - attempt_id
        - reply_received
        - error
      properties:
        state:
          $ref: '#/components/schemas/ConnectionState'
        reason:
          type: string
          minLength: 1
        milestone:
          type: string
          enum:
            - transport_ready
            - target_request_sent
            - target_confirmed
            - first_reply
            - terminal
            - unknown
        attempt_id:
          type:
            - string
            - 'null'
        reply_received:
          type:
            - boolean
            - 'null'
        error:
          type:
            - string
            - 'null'
    RuleResult:
      type: string
      enum:
        - matched
        - not_matched
        - skipped
        - indeterminate
    RuleCondition:
      type: object
      required:
        - id
        - expression
        - result
        - missing_inputs
      properties:
        id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RuleEvaluation:
      type: object
      required:
        - rule_id
        - expression
        - result
        - missing_inputs
        - conditions
      properties:
        rule_id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
    EntityTagList:
      type: string
      description: '`*` or a comma-separated list of entity tags, strong or weak (W/ prefix), as RFC 9110 §8.8.3 and §13.1.1 define. An entity tag contains no space, tab or inner double quote. Empty list elements are ignored, as §5.6.1.2 requires of recipients.'
      pattern: ^(\*|((W/)?"[!#-~\u0080-\u00ff]*")?([ \t]*,[ \t]*((W/)?"[!#-~\u0080-\u00ff]*")?)*)$
    IpAddress:
      description: An IPv4 or IPv6 address. Validators must enforce the ipv4 and ipv6 formats; without format assertion, either branch accepts any string.
      anyOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
    RoutingTraceInput:
      type: object
      additionalProperties: false
      required:
        - network
        - dst_port
      properties:
        network:
          $ref: '#/components/schemas/Transport'
        domain:
          type:
            - string
            - 'null'
          minLength: 1
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        dst_port:
          type: integer
          minimum: 1
          maximum: 65535
        src_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        src_port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
        pname:
          type:
            - string
            - 'null'
        dscp:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 63
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
      anyOf:
        - required:
            - domain
          properties:
            domain:
              type: string
              minLength: 1
        - required:
            - dst_ip
          properties:
            dst_ip:
              $ref: '#/components/schemas/IpAddress'
    RoutingTraceRequest:
      type: object
      additionalProperties: false
      required:
        - input
      properties:
        input:
          $ref: '#/components/schemas/RoutingTraceInput'
        resolve:
          type: string
          enum:
            - none
            - live
          default: none
      allOf:
        - if:
            required:
              - resolve
            properties:
              resolve:
                const: live
          then:
            properties:
              input:
                allOf:
                  - required:
                      - domain
                    properties:
                      domain:
                        type: string
                        minLength: 1
                  - properties:
                      dst_ip:
                        type: 'null'
    RoutingEvaluation:
      type: object
      required:
        - dst_ip
        - decision
        - outbound
        - missing_inputs
        - rules
      properties:
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        decision:
          type: string
          enum:
            - determinate
            - indeterminate
        outbound:
          type:
            - string
            - 'null'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
    SimulationDnsData:
      allOf:
        - $ref: '#/components/schemas/DnsStepData'
        - type: object
          properties:
            lookup_id:
              type: string
              minLength: 1
              description: Simulation-local lookup ID; never a recorded-flow identity.
            purpose:
              const: dial_target
            attempt_id:
              type: 'null'
              description: Simulations never create outbound attempts.
    RoutingTraceResponse:
      type: object
      required:
        - mode
        - instance_id
        - generation_id
        - observed_at
        - evaluations
        - dns
      properties:
        mode:
          type: string
          const: simulation
        instance_id:
          type: string
          minLength: 1
        generation_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/RoutingEvaluation'
        dns:
          type: array
          items:
            $ref: '#/components/schemas/SimulationDnsData'
      not:
        anyOf:
          - required:
              - id
          - required:
              - flow_id
          - required:
              - connection_id
      description: Hypothetical output. It never identifies or claims history for a live flow.
    RuleSource:
      oneOf:
        - type: 'null'
        - type: object
          required:
            - file
            - source_id
            - line
            - column
          properties:
            file:
              type: string
              minLength: 1
              description: Source path or URL as written, apart from listener secrets.
            source_id:
              type: string
              minLength: 1
              description: |
                Source ID from GET /config. Open the source by ID under the configuration
                visibility rules; never derive a path from file.
            line:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
            column:
              $ref: '#/components/schemas/NullableSafeUInt'
              minimum: 1
              description: One-based UTF-8 byte column of the rule's first token, or null if unknown.
      description: Source location, or null when unavailable. Coordinates refer to the original source before listener secrets are masked.
    RoutingRule:
      type: object
      required:
        - rule_id
        - index
        - expression
        - outbound
        - must
        - source
        - kind
      properties:
        rule_id:
          type: string
          minLength: 1
          description: Identical to POST /routing/trace rule IDs and FlowSummary.rule_id within the same generation; opaque to clients.
        index:
          $ref: '#/components/schemas/SafeUInt'
          description: Zero-based evaluation order within this generation, not a cross-generation identity.
        expression:
          type: string
          minLength: 1
          description: Display text for the rule; see rules, Rule expressions. Not an editable source representation.
        outbound:
          type: string
          minLength: 1
          description: Rule outbound, not a resolved leaf node or a claim of a successful dial.
        must:
          type: boolean
        source:
          $ref: '#/components/schemas/RuleSource'
        kind:
          type: string
          enum:
            - rule
            - fallback
    RuleFallback:
      type: object
      required:
        - outbound
        - source
      properties:
        outbound:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/RuleSource'
      description: Same outbound and source as the fallback entry in rules; the entry carries its rule_id.
    RuleList:
      type: object
      required:
        - generation_id
        - rules
        - fallback
      properties:
        generation_id:
          type: string
          minLength: 1
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutingRule'
          contains:
            type: object
            required:
              - kind
            properties:
              kind:
                const: fallback
          minContains: 1
          maxContains: 1
          description: Complete evaluation order with unique rule_id and index values, including exactly one final fallback entry.
        fallback:
          $ref: '#/components/schemas/RuleFallback'
    DnsRecordType:
      type: string
      pattern: ^(?:[A-Z][A-Z0-9-]*|TYPE[0-9]{1,5}|[0-9]{1,5})$
    DnsAnswer:
      type: object
      required:
        - name
        - type
        - class
        - ttl
        - data
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        data:
          type: string
    DnsQuestion:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
    DnsRoute:
      type: object
      required:
        - source
        - rule
      properties:
        source:
          type: string
          enum:
            - forced
            - dns.routing
            - default
        rule:
          type:
            - string
            - 'null'
    DnsQueryResult:
      type: object
      required:
        - type
        - cached
        - cache_entry_id
        - upstream
        - route
        - status
        - elapsed_ms
        - question
      properties:
        type:
          $ref: '#/components/schemas/DnsRecordType'
        cached:
          type: boolean
        cache_entry_id:
          type:
            - string
            - 'null'
        upstream:
          type:
            - string
            - 'null'
        route:
          $ref: '#/components/schemas/DnsRoute'
        status:
          type: string
          minLength: 1
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        question:
          $ref: '#/components/schemas/DnsQuestion'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsQueryRequest:
      type: object
      additionalProperties: false
      required:
        - domain
      properties:
        domain:
          type: string
          minLength: 1
          description: DNS name within the 255-wire-octet and 63-octet-label limits.
        type:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DnsRecordType'
          default:
            - A
          description: Unique record types.
        upstream:
          type: string
          minLength: 1
          description: Force this upstream from dns.upstream instead of dns.routing.
        cache_mode:
          type: string
          enum:
            - normal
            - bypass
          default: normal
    DnsQueryResponse:
      type: object
      required:
        - domain
        - cache_mode
        - query_time
        - results
      properties:
        domain:
          type: string
          minLength: 1
        cache_mode:
          type: string
          enum:
            - normal
            - bypass
        query_time:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DnsQueryResult'
    DnsCacheCoverage:
      type: object
      required:
        - positive
        - negative
        - persistent
      properties:
        positive:
          type: boolean
        negative:
          type: boolean
        persistent:
          type: boolean
    DnsCacheEntry:
      type: object
      required:
        - entry_id
        - domain
        - type
        - class
        - status
        - expires_at
        - stale_until
      properties:
        entry_id:
          type: string
          minLength: 1
        domain:
          type: string
          minLength: 1
          pattern: \.$
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        stale_until:
          $ref: '#/components/schemas/NullableTimestamp'
    DnsCacheList:
      type: object
      required:
        - observed_at
        - coverage
        - entries
        - total
        - next_cursor
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        coverage:
          $ref: '#/components/schemas/DnsCacheCoverage'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DnsCacheEntry'
        total:
          $ref: '#/components/schemas/SafeUInt'
        next_cursor:
          type:
            - string
            - 'null'
        usage:
          $ref: '#/components/schemas/DnsCacheUsage'
          description: Absent from servers that predate cache usage reporting.
    DnsCacheUsage:
      type: object
      description: Whole runtime cache at snapshot time, independent of the listing filters. Every page of one snapshot repeats the same values. The entry count is the cache's only limit; the size of an entry is not bounded.
      required:
        - entries
        - entry_capacity
      properties:
        entries:
          $ref: '#/components/schemas/UInt64'
        entry_capacity:
          oneOf:
            - $ref: '#/components/schemas/UInt64'
            - type: 'null'
          description: Effective entry limit after the engine applies its bounds, or null when the cache has no entry limit or the engine cannot report it.
    DnsLogRecord:
      type: object
      required:
        - id
        - observed_at
        - src
        - question
        - status
        - cached
        - upstream
        - route
        - elapsed_ms
        - answers
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque, unique within the running instance; the cursor is derived from it.
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        src:
          type:
            - string
            - 'null'
          description: Client socket address, IPv6 in brackets; null when the resolver itself asked.
        question:
          $ref: '#/components/schemas/DnsQuestion'
        status:
          type: string
          minLength: 1
          description: RCODE name such as NOERROR or NXDOMAIN, or an engine outcome such as TIMEOUT.
        cached:
          type: boolean
        upstream:
          type:
            - string
            - 'null'
          description: The upstream that answered, null on a cache hit or failure before sending.
        route:
          $ref: '#/components/schemas/DnsRoute'
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsLogList:
      type: object
      required:
        - observed_at
        - total
        - next_cursor
        - records
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        total:
          $ref: '#/components/schemas/SafeUInt'
          description: Records in the ring at observed_at, before filters.
        next_cursor:
          type:
            - string
            - 'null'
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsLogRecord'
    DnsRoutingRule:
      type: object
      required:
        - rule_id
        - index
        - expression
        - action
        - upstream
        - source
        - kind
      properties:
        rule_id:
          type: string
          minLength: 1
          description: Stable within the generation and unique across both lists; addresses the rule. Opaque to clients.
        index:
          $ref: '#/components/schemas/SafeUInt'
          description: Zero-based evaluation order within its list and generation, not a cross-generation identity.
        expression:
          type: string
          minLength: 1
          description: Display text for the rule; see rules, Rule expressions. Not an editable source representation.
        action:
          type: string
          enum:
            - upstream
            - asis
            - reject
            - accept
            - requery
          description: |
            Request rules: upstream sends the query to the named upstream, asis sends it
            to the original destination, reject answers it empty. Response rules: accept
            keeps the answer, reject replaces it with an empty one, requery resolves the
            query again through the named upstream.
        upstream:
          type:
            - string
            - 'null'
          minLength: 1
          description: Upstream name for upstream and requery, as the engine resolved it; it may differ in case from the source text. Null for other actions.
        source:
          $ref: '#/components/schemas/RuleSource'
        kind:
          type: string
          enum:
            - rule
            - fallback
      if:
        required:
          - action
        properties:
          action:
            enum:
              - upstream
              - requery
      then:
        properties:
          upstream:
            type: string
      else:
        properties:
          upstream:
            type: 'null'
    DnsRuleList:
      type: object
      required:
        - generation_id
        - request
        - response
      properties:
        generation_id:
          type: string
          minLength: 1
        request:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/DnsRoutingRule'
              - properties:
                  action:
                    enum:
                      - upstream
                      - asis
                      - reject
          contains:
            type: object
            required:
              - kind
            properties:
              kind:
                const: fallback
          minContains: 1
          maxContains: 1
          description: Request rules in evaluation order with unique rule_id and index values, ending with exactly one fallback entry.
        response:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/DnsRoutingRule'
              - properties:
                  action:
                    enum:
                      - accept
                      - reject
                      - requery
          contains:
            type: object
            required:
              - kind
            properties:
              kind:
                const: fallback
          minContains: 1
          maxContains: 1
          description: Response rules in evaluation order with unique rule_id and index values, ending with exactly one fallback entry.
    DeleteCount:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: integer
          minimum: 0
    DeleteMatchingCount:
      type: object
      required:
        - matched
        - deleted
      properties:
        matched:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
    OperationKind:
      type: string
      enum:
        - probe
        - reload
        - suspend
        - resume
        - group_update
        - provider_refresh
        - geodata_update
        - node_create
        - node_delete
        - provider_create
        - provider_delete
    OperationAccepted:
      type: object
      description: A replayed Idempotency-Key returns this original body unchanged, including status queued, whatever the operation's current status.
      required:
        - operation_id
        - kind
        - status
        - href
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          type: string
          const: queued
        href:
          type: string
          pattern: ^/api/v1/operations/[^/]+$
    Operation:
      oneOf:
        - $ref: '#/components/schemas/QueuedOperation'
        - $ref: '#/components/schemas/RunningOperation'
        - $ref: '#/components/schemas/FailedOperation'
        - $ref: '#/components/schemas/ProbeSucceededOperation'
        - $ref: '#/components/schemas/ReloadSucceededOperation'
        - $ref: '#/components/schemas/SuspendSucceededOperation'
        - $ref: '#/components/schemas/ResumeSucceededOperation'
        - $ref: '#/components/schemas/GroupUpdateSucceededOperation'
        - $ref: '#/components/schemas/ProviderRefreshSucceededOperation'
        - $ref: '#/components/schemas/GeoDataUpdateSucceededOperation'
        - $ref: '#/components/schemas/NodeCreateSucceededOperation'
        - $ref: '#/components/schemas/NodeDeleteSucceededOperation'
        - $ref: '#/components/schemas/ProviderCreateSucceededOperation'
        - $ref: '#/components/schemas/ProviderDeleteSucceededOperation'
    QueuedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: queued
            started_at:
              type: 'null'
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    RunningOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: running
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    FailedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: failed
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/SafeError'
    ProbeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: probe
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ProbeResult'
            error:
              type: 'null'
    ReloadSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: reload
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ReloadResult'
            error:
              type: 'null'
    ReloadResult:
      type: object
      required:
        - active_generation_id
        - datapath_generation_id
      properties:
        active_generation_id:
          type:
            - string
            - 'null'
        datapath_generation_id:
          type:
            - string
            - 'null'
    SuspendSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: suspend
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - suspended
                    - null
            error:
              type: 'null'
    ResumeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: resume
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - running
                    - null
            error:
              type: 'null'
    GroupUpdateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: group_update
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/GroupUpdateResult'
            error:
              type: 'null'
    GroupUpdateResult:
      type: object
      required:
        - group_id
        - config_revision
      properties:
        group_id:
          type: string
          minLength: 1
        config_revision:
          type: string
          minLength: 1
    EventKind:
      type: string
      enum:
        - stream.ready
        - runtime.updated
        - flow.updated
        - flow.gap
        - operation.updated
        - generation.changed
    LogLevel:
      type: string
      enum:
        - trace
        - debug
        - info
        - warn
        - error
    LogRecord:
      type: object
      required:
        - ts
        - level
        - target
        - message
        - fields
      properties:
        ts:
          $ref: '#/components/schemas/Timestamp'
        level:
          $ref: '#/components/schemas/LogLevel'
        target:
          type:
            - string
            - 'null'
          minLength: 1
          description: The engine component that emitted the record, such as a module name; not a network destination. null when the engine does not report one.
        message:
          type: string
          minLength: 1
          description: Sanitized operator message; no secrets or raw configuration.
        fields:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Sanitized structured fields, or null when unavailable; the message safety rules apply recursively.
    RuntimeSettingField:
      type: string
      enum:
        - log.level
        - log.buffered_records
        - dns_log.max_records
        - flows.max_flows
        - flows.retention_seconds
        - record_flows
        - record_logs
        - record_dns_log
        - geodata
    RuntimeSettings:
      type: object
      required:
        - observed_at
        - source
      description: Every section is optional. A value appears when resources.runtime_settings.fields lists it; an engine may also report a value it cannot change.
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum:
            - config
            - runtime
          description: config while every value comes from the activated configuration; runtime once any PATCH overrode one. geodata has its own source and does not affect this one.
        log:
          type: object
          minProperties: 1
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
              description: Minimum severity the engine emits. A lower stream level cannot recover records the engine did not emit.
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: Log replay ring capacity, within logs.min_buffered_records and logs.max_buffered_records. Independent of level.
        dns_log:
          type: object
          required:
            - max_records
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: DNS log ring capacity, within dns_log.min_records and dns_log.max_records.
        flows:
          type: object
          minProperties: 1
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: Retained flows, within flows.min_flows and flows.max_flows.
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: Maximum age of a retained terminal flow, in seconds, bounded by resources.flows.retention_seconds. Capacity pressure may evict it earlier.
        recording:
          type: object
          minProperties: 1
          description: |
            Read-only recorder state. Each recorder appears when its record_* field is listed in
            resources.runtime_settings.fields. In auto mode a recorder captures on demand, so the
            first history a client reads may be empty. Engine-specific demand rules are
            documented with the engine; see the honk notes.
          properties:
            flows:
              $ref: '#/components/schemas/RecorderState'
            logs:
              $ref: '#/components/schemas/RecorderState'
            dns_log:
              $ref: '#/components/schemas/RecorderState'
            events:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
                  description: Event capture is running.
            grace_remaining_seconds:
              $ref: '#/components/schemas/SafeUInt'
              description: Seconds left in the engine's attachment grace after the last client left, 0 while a client is attached or once the grace has run out. Which recorders follow this grace is engine-defined, and a recorder may keep its own demand timer that this value does not count. Absent when the engine keeps no attachment grace.
        geodata:
          $ref: '#/components/schemas/GeoDataSettings'
          description: Geodata download sources and automatic updates. Present when resources.geodata.configurable_sources is true. URLs are returned as written, with only listener-secret values masked, to every admitted caller.
    RuntimeSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        record_flows:
          $ref: '#/components/schemas/RecorderMode'
        record_logs:
          $ref: '#/components/schemas/RecorderMode'
        record_dns_log:
          $ref: '#/components/schemas/RecorderMode'
        log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
        dns_log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
        flows:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
        geodata:
          $ref: '#/components/schemas/GeoDataSettingsPatch'
    RecorderMode:
      type: string
      enum:
        - 'on'
        - 'off'
        - auto
      description: A recorder's mode. "on" keeps a permitted recorder on without clients, "off" forces it off, and auto (the startup default) lets the engine record on demand. What counts as demand, and how long it lasts, is engine-defined. PATCH sets it, GET reports it in RecorderState.mode, and resources.flows.recording reports the effective flow policy, which can be off when recording is disallowed or sampled when the engine samples.
    RecorderState:
      type: object
      required:
        - allowed
        - mode
        - active
      properties:
        allowed:
          type: boolean
          description: The configuration permits this recorder; false means never, whatever the mode.
        mode:
          $ref: '#/components/schemas/RecorderMode'
          description: The mode last set by PATCH, or auto when none was set.
        active:
          type: boolean
          description: The recorder is capturing right now.
    StreamReadyEvent:
      type: object
      required:
        - instance_id
        - observed_at
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      not:
        anyOf:
          - required:
              - href
          - required:
              - resource_id
          - required:
              - revision
          - required:
              - status
          - required:
              - reason
          - required:
              - previous_generation_id
          - required:
              - generation_id
    RuntimeUpdatedEvent:
      type: object
      description: Coalesced invalidation of the runtime snapshot. Also sent when an entry is added to, changed in, or cleared from runtime degradations.
      required:
        - instance_id
        - observed_at
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        href:
          const: /api/v1/runtime
    FlowUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - revision
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        href:
          type: string
          pattern: ^/api/v1/flows/[^/]+$
    FlowGapEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - reason
        - dropped_records
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type:
            - string
            - 'null'
        reason:
          type: string
          enum:
            - buffer_overflow
            - sampled
            - evicted
            - recording_changed
        dropped_records:
