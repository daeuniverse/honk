                  - type: object
                    properties:
                      kind:
                        const: reload
              examples:
                queued:
                  value:
                    operation_id: op-config-01
                    kind: reload
                    status: queued
                    href: /api/v1/operations/op-config-01
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-config-01
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Control permission is absent, editing is disabled, the source is read-only, or the replacement sets or changes API listener settings or secrets
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permission_denied:
                  value:
                    error:
                      code: permission_denied
                      message: Configuration source is not writable.
                    request_id: request-write-1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: If-Match does not match the stored content hash, on arrival or at commit; the replacement is not stored
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                stale_revision:
                  value:
                    error:
                      code: stale_revision
                      message: Source changed in the configuration store; reconcile before retrying.
                    request_id: request-write-2
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Full validation found error diagnostics, including restart-required; nothing is stored and no reload starts
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigDiagnosticsErrorResponse'
              examples:
                invalid:
                  value:
                    error:
                      code: unsupported_value
                      message: Configuration validation failed.
                      details:
                        diagnostics:
                          - level: error
                            source_id: source-main
                            line: 1
                            column: 9
                            span:
                              start_line: 1
                              start_column: 9
                              end_line: 1
                              end_column: 10
                            code: unclosed_block
                            message: Block is not closed.
                    request_id: request-write-3
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '428':
