              - default_member_id
              - final_outbound
              - check_url
              - check_interval
              - tolerance
              - idle_timeout
              - interrupt_connections
        probe_transports:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Transport'
    Group:
