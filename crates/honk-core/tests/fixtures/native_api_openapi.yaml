  /api/v1/dns/rules:
    get:
      operationId: listDnsRules
      tags:
        - DNS
      summary: Read the running generation's DNS routing rules
      description: |
        Requires resources.dns_rules.available. Return the DNS routing rules of the
        running generation, which is the accepted configuration, as two ordered lists:
        request rules pick how a query is resolved, and response rules decide whether
        an answer is accepted, rejected or re-queried. Each list is in evaluation order
        and ends with exactly one fallback entry. A fallback the configuration does not
        write still appears, with the engine's default action and a null source.
        A rule the configuration parser omitted with a diagnostic is not listed.
        This resource is read-only. Rules are edited by replacing the source that holds
        them with PUT /api/v1/config/sources/{source_id}, the same as traffic rules;
        there is no rule-level write endpoint. rule_id is stable within a generation
        and addresses the rule; it is unique across both lists. expression follows
        the display rule in rules; upstream is the name as the engine resolved it and may
        differ in case from the source text. generation_id identifies the rules'
        routing generation; refetch after generation.changed. There is no paginated snapshot. If a coherent
        generation cannot be pinned, return 503 snapshot_unavailable.
        resources.dns_rules.max_rules is never below either running list's size, so
        both lists are always returned complete and never truncated.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Ordered request and response rules, each with its fallback, from one running generation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsRuleList'
              examples:
                running:
                  value:
                    generation_id: generation-42
                    request:
                      - rule_id: dns_request:0
                        index: 0
                        expression: qname(geosite:cn) -> alidns
                        action: upstream
                        upstream: alidns
                        source:
                          file: config.dae
                          source_id: source-main
                          line: 40
                          column: 7
                        kind: rule
                      - rule_id: dns_request:1
                        index: 1
                        expression: qtype(aaaa) -> reject
                        action: reject
                        upstream: null
                        source:
                          file: config.dae
                          source_id: source-main
                          line: 41
                          column: 7
                        kind: rule
                      - rule_id: dns_request:2
                        index: 2
                        expression: 'fallback: googledns'
                        action: upstream
                        upstream: googledns
                        source:
                          file: config.dae
                          source_id: source-main
                          line: 42
                          column: 7
                        kind: fallback
                    response:
                      - rule_id: dns_response:0
                        index: 0
                        expression: upstream(googledns) && ip(geoip:private) -> alidns
                        action: requery
                        upstream: alidns
                        source:
                          file: config.dae
                          source_id: source-main
                          line: 45
                          column: 7
                        kind: rule
                      - rule_id: dns_response:1
                        index: 1
                        expression: 'fallback: accept'
                        action: accept
                        upstream: null
                        source: null
                        kind: fallback
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          description: A coherent generation could not be pinned (snapshot_unavailable)
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                snapshot_unavailable:
                  value:
                    error:
                      code: snapshot_unavailable
                      message: A coherent routing generation is unavailable; retry the read.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
