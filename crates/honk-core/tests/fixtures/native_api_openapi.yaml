                      geoip:
                        urls:
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                      auto_update:
                        enabled: true
