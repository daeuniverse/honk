                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                      auto_update:
                        enabled: true
                        interval_hours: 24
                      download:
                        route: routing
                        group_id: null
                      verify_checksum: true
                  x-headers:
                    Content-Type: application/json
