  /api/v1/events:
    get:
      operationId: streamEvents
      tags:
        - Events
      summary: Follow bounded resumable invalidation events
      description: |
        Every connection begins with stream.ready; a resumed connection then replays
        retained events after Last-Event-ID; see [Replay and recovery](/v0.1.0/en/docs/events.html#Replay-and-recovery).
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: kinds
          in: query
          description: Comma-separated advertised event kinds. A kind outside EventKind or a repeated kind returns 400; an EventKind member the capabilities do not advertise returns 422.
          schema:
            type: string
            minLength: 1
          example: flow.updated,flow.gap
        - name: flow_id
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Server-sent events; validate data using the schema selected by the event name.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            text/event-stream:
              schema:
                type: string
              x-event-data-schemas:
                stream.ready: '#/components/schemas/StreamReadyEvent'
                runtime.updated: '#/components/schemas/RuntimeUpdatedEvent'
                flow.updated: '#/components/schemas/FlowUpdatedEvent'
                flow.gap: '#/components/schemas/FlowGapEvent'
                operation.updated: '#/components/schemas/OperationUpdatedEvent'
                generation.changed: '#/components/schemas/GenerationChangedEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventCursorExpired'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: max_clients streams are already open, or the event stream is unavailable (temporarily_unavailable)
  /api/v1/logs:
    get:
      operationId: streamLogs
      tags:
        - Logs
      summary: Follow bounded resumable engine logs
      description: |
        Requires resources.logs.available. Emit stream.ready first on every connection,
        using the shared StreamReadyEvent payload and an opaque replay cursor. On a
        valid resume, deliver retained matching records strictly after Last-Event-ID,
        then live records without an unobserved gap. The ready cursor must not skip
        pending replay; retain the supplied cursor until replay advances it.
        Each log frame carries an opaque id unique within the running instance.
        Duplicate delivery is permitted; deduplicate by id, never by message or ts.
        Cursors are bound to this stream, instance and filters. Unknown, expired,
        previous-instance or changed-filter cursors return 409 event_cursor_expired
        before opening the stream. Drop the cursor and reconnect to establish a new
        baseline; lost history is not recovered. Filtered-out IDs may leave gaps.
        Retain at most resources.logs.max_buffered_records records, none older than
        resources.logs.retention_seconds; this is not durable storage.
        Close slow clients when their bounded queue fills; never block engine writers.
        Send heartbeat comments at most 15 seconds apart while idle. Recheck credentials
        on reconnect and terminate streams when authorization is revoked.
        Sanitize messages and fields before buffering: no secrets, credentials, raw
        configuration, stack traces or unredacted local paths. Never forward raw engine output.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: level
          in: query
          description: Minimum severity, ordered trace < debug < info < warn < error. Omit for all advertised levels. A value outside LogLevel returns 400 invalid_request; a LogLevel member not in resources.logs.levels returns 422 unsupported_value.
          schema:
            $ref: '#/components/schemas/LogLevel'
          example: info
        - name: target
          in: query
          description: Case-sensitive literal prefix of LogRecord.target; omit for all targets. Requires target in resources.logs.filters, otherwise 422 unsupported_value. Records whose target is null never match.
          schema:
            type: string
            minLength: 1
          example: honk::routing
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Log stream; stream.ready precedes replay and live log frames. Heartbeat comments have no id or data.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            text/event-stream:
              schema:
                type: string
              x-event-data-schemas:
                stream.ready: '#/components/schemas/StreamReadyEvent'
                log: '#/components/schemas/LogRecord'
              examples:
                records:
                  value: |
                    id: instance-7:logs:123
                    event: stream.ready
                    data: {"instance_id":"instance-7","observed_at":"2026-09-14T10:00:00Z"}

                    id: instance-7:logs:124
                    event: log
                    data: {"ts":"2026-09-14T10:00:01Z","level":"info","target":"honk::routing","message":"Routing generation published.","fields":{"generation_id":"generation-42"}}

                    : heartbeat
                  x-headers:
                    Content-Type: text/event-stream
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventCursorExpired'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          description: level is a LogLevel member not in resources.logs.levels, or target is set while resources.logs.filters omits target (unsupported_value).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unadvertised_filter:
                  value:
                    error:
                      code: unsupported_value
                      message: target is not an advertised log filter.
                      details: null
                    request_id: request-5
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/runtime/settings:
    get:
      operationId: getRuntimeSettings
      tags:
        - Runtime settings
      summary: Read the runtime-adjustable settings
      description: |
        Requires resources.runtime_settings.available. Returns the current
        runtime-adjustable settings. Only observed_at and source are always present:
        a value appears when resources.runtime_settings.fields lists it, and
        recording.flows, recording.logs and recording.dns_log appear when
        record_flows, record_logs and record_dns_log are listed. An engine may
        report other values it cannot change. Numeric values stay inside their
        capability bounds. source is config when values come from the activated
        configuration and runtime after a runtime override. geodata appears when
        resources.geodata.configurable_sources is true and carries its own source.
        Its URLs are returned as written, with only listener-secret values masked,
        to every admitted caller; see the visibility table in api-config.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Current runtime settings
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
