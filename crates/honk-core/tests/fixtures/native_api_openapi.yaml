        chain_source:
          type: string
          enum:
            - evaluation
            - reconstructed
            - unknown
          description: Selection captured at evaluation, reconstructed from retained evidence, or unavailable; never a current group snapshot.
        rule_id:
          type:
            - string
            - 'null'
          description: Generation-scoped traffic rule ID, or null when unavailable.
        rule_expression:
