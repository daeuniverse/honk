name: Bug report / 问题报告
description: Report a reproducible failure in honk, with system details and relevant logs. / 请报告可复现的 honk 故障，并提供系统信息与相关日志。
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        AI may help you write this; unverified content may not be submitted.
        可以用 AI 辅助撰写，但提交前须自行核实全部内容。

        State each fact once; do not restate the title, diff or template.
        同一件事只写一次，不要重复标题、代码改动或模板内容。
        No filler, praise, summaries of your own work or emoji.
        不写客套话、夸赞和自我总结，不用表情符号。
        Paste only relevant log lines; link or collapse long output.
        日志只贴相关的几行；较长的输出请附链接或折叠。
        Say what you could not verify.
        没有验证过的地方请注明。

        Side-router (bypass gateway) deployments are not supported; questions and bug reports about them are closed.
        旁路由部署不在支持范围内，相关的提问和问题报告会直接关闭。

        Write in English or Chinese. Remove passwords, UUIDs, subscription URLs and API tokens. If only the web interface fails while honk's logs and API responses are correct, report it at https://github.com/Zakkaus/doona/issues.

        可以用中文或英文填写。请删去密码、UUID、订阅链接和 API token。如果只有网页界面异常，而 honk 的日志和 API 响应都正常，请到 https://github.com/Zakkaus/doona/issues 提交。
  - type: input
    id: human-responsible
    attributes:
      label: Human responsible / 负责人
      description: Enter your GitHub username; you verified this report and will answer follow-up questions. / 请填写你的 GitHub 用户名。填写即表示你已核实报告，并会回复后续提问。
      placeholder: "@your-name"
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version / 版本
      description: Paste the output of `honk-core --version`. / 请粘贴 `honk-core --version` 的输出。
      render: text
    validations:
      required: true
  - type: textarea
    id: kernel
    attributes:
      label: Kernel / 内核
      description: Run `uname -r` and paste its output. / 请粘贴 `uname -r` 的输出。
      render: text
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System / 系统
      description: Give your distribution or OpenWrt release and CPU architecture. / 请填写发行版或 OpenWrt 版本及 CPU 架构。
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package or build / 安装包或构建方式
      description: Give the release asset name, OpenWrt package, or source commit and build features. / 请填写下载的发布文件名、OpenWrt 软件包名，或源码 commit 和启用的构建 feature。
      placeholder: honk-core-<version>-aarch64-unknown-linux-musl-stock.tar.gz
  - type: input
    id: device
    attributes:
      label: Device or deployment / 设备或部署方式
      description: Name the router model or indicate a VM, PVE or Docker deployment. / 请填写路由器型号，或注明运行在虚拟机、PVE 还是 Docker 中。
  - type: textarea
    id: environment
    attributes:
      label: Other environment details / 其他环境信息
      description: List other proxy software on the same host and any sysctl settings you changed. / 请列出同一主机上的其他代理软件，以及修改过的 sysctl 设置。
  - type: textarea
    id: what-happened
    attributes:
      label: What you did and observed / 问题现象
      description: Describe what you did, what you expected, and what actually happened. / 请说明你做了什么、预期的结果和实际的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Give the commands, inputs and actions needed to trigger the failure. / 请列出触发问题所需的命令、输入和操作。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration / 相关配置
      description: Paste the smallest configuration fragment needed to reproduce the problem, with secrets removed. / 请粘贴能复现问题的最小配置片段，并删去敏感信息。
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      description: Include only relevant lines from `journalctl -u honk` or `logread` on OpenWrt; if none are available, write "none" and explain why. / 只贴 `journalctl -u honk` 或 OpenWrt 上 `logread` 输出中的相关几行。没有日志请填“无”并说明原因。
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / 截图
      description: Attach images only if they show something the text and logs cannot. / 只有文字和日志说明不了问题时，才需要附截图。
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 确认
      description: Check only true claims; an applicable required box left unchecked or a false claim closes the issue. / 只勾选属实的选项。适用的必选项没有勾选，或勾选的内容不属实，issue 会被关闭。
      options:
        - label: I searched existing issues / 我已搜索过现有 issue
          required: true
        - label: This describes what I observed / 以上是我实际遇到的情况
          required: true
        - label: The problem also happens on the latest release or Debug build / 最新正式版或 Debug 构建也有这个问题
        - label: I checked the boxes above without reading them / 我没有阅读上面的选项就直接勾选了
        - label: I am an AI agent, and this content was submitted without human review / 我是 AI 代理，这些内容没有经过人工审核
