name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev

      # routing::tests::test_geosite_* need geo assets (locally found at
      # /etc/dae/geosite.dat; the runner has none).
      - name: Read geo cache key
        id: geo-pins
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          echo "key=$GEOSITE_SHA256-$GEOIP_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geo-assets
          key: geo-${{ steps.geo-pins.outputs.key }}
      - name: Install geo assets for the geosite tests
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          geo_dir="$RUNNER_TEMP/geo-assets"
          mkdir -p "$geo_dir"
          if ! test -f "$geo_dir/geosite.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geosite.dat" \
              "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_TAG/dlc.dat"
          fi
          if ! test -f "$geo_dir/geoip.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geoip.dat" \
              "https://github.com/v2fly/geoip/releases/download/$GEOIP_TAG/geoip.dat"
          fi
          echo "$GEOSITE_SHA256  $geo_dir/geosite.dat" | sha256sum -c -
          echo "$GEOIP_SHA256  $geo_dir/geoip.dat" | sha256sum -c -
          sudo install -D -m 0644 "$geo_dir/geosite.dat" /etc/dae/geosite.dat
          sudo install -D -m 0644 "$geo_dir/geoip.dat" /etc/dae/geoip.dat
      - run: cargo test --workspace --no-fail-fast

  build:
    name: build ${{ matrix.target }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both arches ship two binaries: mimalloc (default, faster QUIC)
          # and stock malloc (lower RSS high-water on small gateways).
          - target: x86_64-unknown-linux-gnu
            suffix: ""
          - target: x86_64-unknown-linux-gnu
            suffix: "-stock"
          - target: x86_64-unknown-linux-musl
            suffix: ""
          - target: x86_64-unknown-linux-musl
            suffix: "-stock"
          - target: aarch64-unknown-linux-gnu
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            suffix: "-stock"
          - target: aarch64-unknown-linux-musl
            suffix: ""
          - target: aarch64-unknown-linux-musl
            suffix: "-stock"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Rust toolchains
        id: toolchain
        run: |
          set -euo pipefail
          echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable (with target)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          target: ${{ matrix.target }}

      - name: Install Rust nightly (for the eBPF object)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}${{ matrix.suffix }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: |
            . -> target
            crates/honk-ebpf -> target

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd

      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$CARGO_HOME/bin"
          bpf-linker --version

      # The eBPF object is target-independent; build it once on the host so
      # cross builds just pick it up (build.rs locates it when present).
      - name: Build eBPF object
        run: |
          set -euo pipefail
          cd crates/honk-ebpf
          cargo build --release -Zbuild-std=core --target bpfel-unknown-none

      # aya refuses objects without BTF ("no BTF parsed for object") — fail
      # the build here instead of at runtime on a gateway.
      - name: Verify eBPF object has BTF
        run: readelf -S crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'

      # boring-sys (BoringSSL, C++) needs a clang-compatible target toolchain:
      # under cross compilation CMake injects clang-style --target flags into
      # boring-sys' ASM rules that real GCC rejects, and zig rejects the Rust
      # triple spelling — ci/zigcc / ci/zigcxx strip those flags and re-anchor
      # on the zig-style target in $ZIGCC_TARGET.
      - name: Install zig (non-native targets)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      # The default feature set carries mimalloc; the "-stock" matrix entries
      # build the same target against the system malloc instead.
      - name: Resolve feature set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suffix }}" == "-stock" ]]; then
            echo "FEATURES=--no-default-features --features clash-api,ebpf,rprx" >> "$GITHUB_ENV"
          else
            echo "FEATURES=--features ebpf" >> "$GITHUB_ENV"
          fi

      # The root rust-toolchain.toml selects the host compiler whose cross
      # targets were installed above; the eBPF crate has its own nightly pin.
      - name: Build honk-core (native gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release -p honk-core $FEATURES --target ${{ matrix.target }}

      - name: Build honk-core (cross via zig wrappers)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          export ZIGCC_TARGET="${T/-unknown/}"
          # cc crate wants lowercase CC_<target_with_underscores>; cargo
          # wants uppercase CARGO_TARGET_<TARGET>.
          L=$(printf '%s' "$T" | tr '-' '_')
          U=$(printf '%s' "$T" | tr 'a-z-' 'A-Z_')
          eval "export CC_${L}=\$PWD/ci/zigcc"
          eval "export CXX_${L}=\$PWD/ci/zigcxx"
          eval "export CARGO_TARGET_${U}_LINKER=\$PWD/ci/zigcc"
          # musl: let zig supply the CRT (Rust's self-contained rcrt1.o and
          # zig's crt1.o both define _start).
          if [[ "$T" == *-musl ]]; then
            eval "export CARGO_TARGET_${U}_RUSTFLAGS='-C link-self-contained=no'"
          fi
          # boring-sys generates its bindings with bindgen at build time —
          # point it at zig's target headers, not the host's.
          export BINDGEN_EXTRA_CLANG_ARGS="$(ci/zig-bindgen-env "$ZIGCC_TARGET")"
          cargo build --release -p honk-core $FEATURES --target "$T"

      - name: Package artifact
        run: |
          set -euo pipefail
          name="honk-core-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/honk-core" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"

      - name: Start the packaged x86_64 artifact
        if: startsWith(matrix.target, 'x86_64-')
        env:
          ARTIFACT_NAME: honk-core-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/release-smoke.XXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "$ARTIFACT_NAME.tar.gz" -C "$smoke_dir"
          "$smoke_dir/$ARTIFACT_NAME/honk-core" --version

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: honk-core-${{ matrix.target }}${{ matrix.suffix }}
          path: honk-core-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}.tar.gz
          retention-days: 1

  release:
    name: GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
