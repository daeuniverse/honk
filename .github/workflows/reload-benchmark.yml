name: Reload benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/honk-config/**"
      - "crates/honk-core/**"
      - "crates/honk-outbound/**"
      - "crates/honk-ebpf-common/**"
      - "crates/honk-nfqueue/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/reload-benchmark.yml"
      - ".github/ci/pins.env"
      - "ci/compare-reload-benchmark.py"
      - "ci/test-compare-reload-benchmark.py"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
      - name: Check out main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
      - name: Read candidate Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' candidate/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
      - name: Read geo cache key
        id: geo-pins
        run: |
          source candidate/.github/ci/pins.env
          echo "key=$GEOSITE_SHA256-$GEOIP_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geo-assets
          key: geo-${{ steps.geo-pins.outputs.key }}
      - name: Install pinned geo assets
        run: |
          source candidate/.github/ci/pins.env
          geo_dir="$RUNNER_TEMP/geo-assets"
          mkdir -p "$geo_dir"
          if ! test -f "$geo_dir/geosite.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geosite.dat" \
              "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_TAG/dlc.dat"
          fi
          if ! test -f "$geo_dir/geoip.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geoip.dat" \
              "https://github.com/v2fly/geoip/releases/download/$GEOIP_TAG/geoip.dat"
          fi
          echo "$GEOSITE_SHA256  $geo_dir/geosite.dat" | sha256sum -c -
          echo "$GEOIP_SHA256  $geo_dir/geoip.dat" | sha256sum -c -
          sudo install -D -m 0644 "$geo_dir/geosite.dat" /etc/dae/geosite.dat
          sudo install -D -m 0644 "$geo_dir/geoip.dat" /etc/dae/geoip.dat
      - name: Install the candidate harness into main
        run: |
          cp candidate/crates/honk-core/benches/reload.rs baseline/crates/honk-core/benches/reload.rs
          # Compare both revisions with the candidate's compiler.
          cp candidate/rust-toolchain.toml baseline/rust-toolchain.toml
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("baseline/crates/honk-core/Cargo.toml")
          text = manifest.read_text()
          if "reload-bench = []" not in text:
              text = text.replace(
                  "dns-bench = []",
                  'dns-bench = []\nreload-bench = []\nreload-alloc-bench = ["reload-bench"]\nreload-bench-counters = ["reload-bench"]',
              )
          if 'name = "reload"' not in text:
              text += '\n[[bench]]\nname = "reload"\nharness = false\nrequired-features = ["reload-bench"]\n'
          if 'path = "src/main.rs"\nbench = false' not in text:
              text = text.replace('path = "src/main.rs"', 'path = "src/main.rs"\nbench = false')
          manifest.write_text(text)

          # Keep the workload identical; adapt only the old reload call signature.
          api = Path("baseline/crates/honk-core/src/control/reload/transaction.rs").read_text()
          legacy_reload = r"pub async fn reload_runtime_config\(\s*&self,\s*new_config:\s*Config,?\s*\)"
          if re.search(legacy_reload, api):
              harness = Path("baseline/crates/honk-core/benches/reload.rs")
              text = harness.read_text()
              call = "reload_runtime_config(config, Default::default())"
              assert text.count(call) == 1, "reload benchmark adapter changed"
              harness.write_text(text.replace(call, "reload_runtime_config(config)"))
          PY
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: |
            baseline -> ${{ runner.temp }}/reload-main-target
            candidate -> ${{ runner.temp }}/reload-candidate-target
      - name: Benchmark main
        run: |
          set -euo pipefail
          cd baseline
          HONK_RELOAD_EXPECT_NOOP=0 \
          HONK_RELOAD_METRICS_ONLY=1 \
          CARGO_TARGET_DIR="$RUNNER_TEMP/reload-main-target" \
            cargo bench -p honk-core --bench reload --no-default-features \
              --features reload-bench,reload-alloc-bench -- --noplot 2>&1 \
            | tee ../main-reload.log
      - name: Benchmark candidate
        run: |
          set -euo pipefail
          cd candidate
          HONK_RELOAD_METRICS_ONLY=1 \
          CARGO_TARGET_DIR="$RUNNER_TEMP/reload-candidate-target" \
            cargo bench -p honk-core --bench reload --no-default-features \
              --features reload-bench-counters,reload-alloc-bench -- --noplot 2>&1 \
            | tee ../candidate-reload.log
      - name: Test reload benchmark comparison
        run: python3 candidate/ci/test-compare-reload-benchmark.py
      - name: Compare candidate with main
        env:
          HONK_RELOAD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HONK_RELOAD_MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          candidate/ci/compare-reload-benchmark.py \
            main-reload.log candidate-reload.log \
            --json candidate/target/ci-report/reload.json
      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reload-benchmark-${{ github.run_id }}
          path: |
            main-reload.log
            candidate-reload.log
      - name: Upload reload CI report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-reload
          path: candidate/target/ci-report/reload.json
          retention-days: 30
          if-no-files-found: error
