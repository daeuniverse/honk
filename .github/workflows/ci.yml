              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "aarch64",
              matrix: {target: "aarch64-unknown-linux-gnu", toolchain: process.env.TOOLCHAIN},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null, units, values, signals: [],
              failure: status === "success" ? null : {summary: `aarch64 lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload aarch64 CI report
        if: always()
