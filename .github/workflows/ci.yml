          test "$(cargo test -p honk-outbound --no-default-features --test feature_boundary "$test_name" -- --exact --list --format terse)" = "$test_name: test"
          cargo test -p honk-outbound --no-default-features --test feature_boundary
      - name: Test toolbox without rprx
        run: |
          set -euo pipefail
          test_name=sub::tests::unavailable_vless_handler_refuses_before_target_resolution
          test "$(cargo test -p honk-tool --no-default-features --bin honk-tool "$test_name" -- --exact --list --format terse)" = "$test_name: test"
          cargo test -p honk-tool --no-default-features
      - name: Write feature-set CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        with:
          script: |
            const fs = require("node:fs");
            const cp = require("node:child_process");
            fs.mkdirSync("target/ci-report", {recursive: true});
            const values = {};
            const units = {};
            try {
              const rustc = cp.execFileSync("rustc", ["-V"], {encoding: "utf8"}).trim();
              const raw = process.env.CACHE_HIT;
              const cache = raw === "true" ? true : raw === "false" ? false : null;
              units.toolchain = "rustc-cache";
              values.toolchain = {value: {rustc, cache_hit: cache}, unit: "rustc-cache", available: true};
            } catch {}
            const status = process.env.JOB_STATUS;
            fs.writeFileSync("target/ci-report/features.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "features",
              matrix: {target: "x86_64-unknown-linux-gnu", toolchain: process.env.TOOLCHAIN, features: "independent"},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null, units, values, signals: [],
              failure: status === "success" ? null : {summary: `features lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload feature-set CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-features
          path: target/ci-report/features.json
          retention-days: 30
          if-no-files-found: error

