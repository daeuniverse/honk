          readelf -S target/bpfel-unknown-none/release/honk-ebpf | grep '\.BTF'
          # build.rs requires the compiler identity as well as source freshness.
          printf '%s' "$EBPF_TOOLCHAIN" > target/bpfel-unknown-none/release/honk-ebpf.toolchain
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Build core and toolbox through the release wrappers
        run: |
          set -euo pipefail
          export ZIGCC_TARGET=x86_64-linux-musl
          export CC_x86_64_unknown_linux_musl="$PWD/ci/zigcc"
          export CXX_x86_64_unknown_linux_musl="$PWD/ci/zigcxx"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/ci/zigcc"
          # Zig supplies the CRT; Rust's self-contained CRT would duplicate _start.
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS='-C link-self-contained=no'
          export BINDGEN_EXTRA_CLANG_ARGS="$(ci/zig-bindgen-env "$ZIGCC_TARGET")"
          cargo build --release -p honk-core --no-default-features --features clash-api,ebpf,rprx,mimalloc --target x86_64-unknown-linux-musl
          cargo build --release -p honk-tool --target x86_64-unknown-linux-musl
      - name: Start the musl toolbox
        working-directory: target/x86_64-unknown-linux-musl/release
        run: ./honk-tool --version
      - name: Write musl CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        with:
          script: |
            const fs = require("node:fs");
            const cp = require("node:child_process");
            fs.mkdirSync("target/ci-report", {recursive: true});
            const values = {};
            const units = {};
            try {
              const rustc = cp.execFileSync("rustc", ["-V"], {encoding: "utf8"}).trim();
              const raw = process.env.CACHE_HIT;
              const cache = raw === "true" ? true : raw === "false" ? false : null;
              units.toolchain = "rustc-cache";
              values.toolchain = {value: {rustc, cache_hit: cache}, unit: "rustc-cache", available: true};
            } catch {}
            const status = process.env.JOB_STATUS;
            fs.writeFileSync("target/ci-report/cross-musl.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "cross-musl",
              matrix: {target: "x86_64-unknown-linux-musl", toolchain: process.env.TOOLCHAIN},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null, units, values, signals: [],
              failure: status === "success" ? null : {summary: `cross-musl lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload musl CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-cross-musl
          path: target/ci-report/cross-musl.json
          retention-days: 30
          if-no-files-found: error

  review-bot:
    name: mechanical PR review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: review
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const paths = files.map((f) => f.filename);
            const crates = new Set(
              paths
                .filter((p) => p.startsWith("crates/"))
                .map((p) => p.split("/")[1]),
            );

            const warnings = [];
            const notes = [];
            const signals = [];

            // AGENTS.md invariant: honk-ebpf-common layout changes must move
            // together with the eBPF program and the userspace map writers.
            const has = (prefix) => paths.some((p) => p.startsWith(prefix));
            if (
              has("crates/honk-ebpf-common/") &&
              !has("crates/honk-ebpf/") &&
              !has("crates/honk-core/src/ebpf/")
            ) {
              const detail = "`crates/honk-ebpf-common` changed without matching changes in `crates/honk-ebpf` or `crates/honk-core/src/ebpf` — shared kernel/userspace layouts must move together.";
              warnings.push(detail);
              signals.push({kind: "shared_layout_changed", detail});
            }
            if (has(".github/workflows/")) {
              const detail = "CI workflow files changed.";
              notes.push(detail);
              signals.push({kind: "workflow_changed", detail});
            }
            if (crates.size > 0 && !has("AGENTS.md") && !has(".agents/rules/")) {
              const detail = "Code changed but neither `AGENTS.md` nor `.agents/rules/` was updated — check whether any documented behavior/convention changed.";
              notes.push(detail);
              signals.push({kind: "rules_not_updated", detail});
            }
            const changedPaths = new Set(files.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)));
            const unpaired = [];
            for (const path of changedPaths) {
              const peer = path === "README.md" ? "README.zh.md" :
                path === "README.zh.md" ? "README.md" :
                path.startsWith("doc/en/") ? path.replace("doc/en/", "doc/zh/") :
                path.startsWith("doc/zh/") ? path.replace("doc/zh/", "doc/en/") : null;
              if (peer && !changedPaths.has(peer)) unpaired.push(path);
            }
            if (unpaired.length) {
              const detail = "English/Chinese documentation changed without its paired page — check translation parity: " +
                unpaired.map(path => `\`${path}\``).join(", ") + ".";
              notes.push(detail);
              signals.push({kind: "docs_language_mismatch", detail});
            }

            const additions = files.reduce((s, f) => s + f.additions, 0);
            const deletions = files.reduce((s, f) => s + f.deletions, 0);
            const lines = [
              `**mechanical review** (bot)`,
              ``,
              `Files: ${paths.length} (+${additions}/-${deletions})` +
                (crates.size
                  ? ` · crates: ${[...crates].map((c) => `\`${c}\``).join(", ")}`
                  : ""),
            ];
            for (const w of warnings) lines.push(`- ⚠️ ${w}`);
            for (const n of notes) lines.push(`- ℹ️ ${n}`);
            if (!warnings.length && !notes.length) {
              lines.push("", "No structural issues detected.");
            }

            const body = lines.join("\n");
            await core.summary.addRaw(body).write();
            core.setOutput("signals", JSON.stringify(signals));
      - name: Write review CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_SIGNALS: ${{ steps.review.outputs.signals }}
        with:
          script: |
            const fs = require("node:fs");
            fs.mkdirSync("target/ci-report", {recursive: true});
            let signals = [];
            try { signals = JSON.parse(process.env.REVIEW_SIGNALS || "[]"); } catch {}
            const status = process.env.JOB_STATUS;
            fs.writeFileSync("target/ci-report/review.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "review",
              matrix: {}, measured_sha: process.env.MEASURED_SHA, baseline_sha: null,
              units: {}, values: {}, signals,
              failure: status === "success" ? null : {summary: `review lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload review CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-review
          path: target/ci-report/review.json
          retention-days: 30
          if-no-files-found: error
