name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev

      # routing::tests::test_geosite_* need geo assets (locally found at
      # /etc/dae/geosite.dat; the runner has none).
      - name: Install geo assets for the geosite tests
        run: |
          sudo mkdir -p /etc/dae
          sudo curl -sL --retry 3 -o /etc/dae/geosite.dat \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          sudo curl -sL --retry 3 -o /etc/dae/geoip.dat \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
      # Full suite minus the known pre-existing config_dae_routing failure.
      - run: |
          cargo test --workspace --no-fail-fast -- \
            --skip test_routing_with_config_dae

  ebpf:
    name: eBPF object + real VM kernel tests
    # These tests attach TC/cgroup programs and therefore cannot run in a job container.
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools
      - name: Install build and VM dependencies
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            busybox-static clang cmake coreutils file iproute2 iptables jq kbd kmod \
            libbpf-dev libclang-dev libvirt-clients llvm pkg-config python3-argcomplete \
            python3-requests python3-venv qemu-kvm rsync udev util-linux virtiofsd zstd
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install virtme-ng 1.41
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/virtme_ng-1.41-py3-none-any.whl" \
            https://files.pythonhosted.org/packages/41/f2/ca99d9bae0a227be4e09082b9dd9fe3bf931900e36aca6e05f85a4599aea/virtme_ng-1.41-py3-none-any.whl
          echo "2031f0f2c67947829e030d66b28950adcef351a17a8455483b57d27b6246f2d2  $RUNNER_TEMP/virtme_ng-1.41-py3-none-any.whl" | sha256sum -c -
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/virtme-ng"
          "$RUNNER_TEMP/virtme-ng/bin/pip" --disable-pip-version-check install --no-deps \
            "$RUNNER_TEMP/virtme_ng-1.41-py3-none-any.whl"
          echo "$RUNNER_TEMP/virtme-ng/bin" >> "$GITHUB_PATH"
      - name: Install bpf-linker 0.11.0
        run: |
          curl -fsSL --retry 3 -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450  /tmp/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc /tmp/bpf-linker.tar.zst | tar -xf - -C "$HOME/.cargo/bin"
          bpf-linker --version
      - name: Install geo assets for eBPF-feature unit tests
        run: |
          sudo mkdir -p /etc/dae
          sudo curl -sL --retry 3 -o /etc/dae/geosite.dat \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          sudo curl -sL --retry 3 -o /etc/dae/geoip.dat \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
      - name: Build eBPF object
        run: |
          cd crates/honk-ebpf
          cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none
      - name: Build routing-test eBPF object separately
        run: |
          cd crates/honk-ebpf
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/honk-ebpf-routing-test" \
            cargo +nightly build --release --features routing-test \
              -Zbuild-std=core --target bpfel-unknown-none
      # aya refuses objects without BTF ("no BTF parsed for object") — fail
      # here instead of at runtime on a gateway.
      - name: Verify eBPF objects have BTF
        run: |
          readelf -S crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'
          readelf -S target/honk-ebpf-routing-test/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'
      - name: Run eBPF-feature unit tests
        run: |
          cargo +stable test -p honk-core --features ebpf --lib -- \
            --skip test_routing_with_config_dae
      - name: Compile real-kernel test binaries on the host
        run: |
          {
            cargo +stable test -p honk-core --features ebpf --lib --test ebpf_datapath_test --no-run --message-format=json
            cargo +stable test -p honk-nfqueue --lib --no-run --message-format=json
          } | jq -sr '
            def executable($name):
              [.[] | select(.reason == "compiler-artifact" and .target.name == $name and .executable != null) | .executable]
              | unique | if length == 1 then .[0] else error("missing or ambiguous test executable: " + $name) end;
            "HONK_CORE_TEST_BIN=" + (executable("honk_core") | @sh),
            "HONK_DATAPATH_TEST_BIN=" + (executable("ebpf_datapath_test") | @sh),
            "HONK_NFQUEUE_TEST_BIN=" + (executable("honk_nfqueue") | @sh)
          ' > target/kernel-test-bins.env
      - name: Fetch verified Linux 6.12 image and modules
        run: |
          kernel_dir="$RUNNER_TEMP/linux-v6.12"
          base=https://kernel.ubuntu.com/mainline/v6.12/amd64
          image=linux-image-unsigned-6.12.0-061200-generic_6.12.0-061200.202411220723_amd64.deb
          modules=linux-modules-6.12.0-061200-generic_6.12.0-061200.202411220723_amd64.deb
          mkdir -p "$kernel_dir"
          curl -fsSL --retry 3 --retry-all-errors -o "$kernel_dir/$image" "$base/$image"
          curl -fsSL --retry 3 --retry-all-errors -o "$kernel_dir/$modules" "$base/$modules"
          echo "3f156eab453866391b1939652829c67f4e4e9a9c18917d76751f41a26da4a330  $kernel_dir/$image" | sha256sum -c -
          echo "5c1bb612091143332f4ca1892086e29b676cc27c83f74cd2d48115203a0c72d8  $kernel_dir/$modules" | sha256sum -c -
          dpkg-deb --extract "$kernel_dir/$image" "$kernel_dir/root"
          dpkg-deb --extract "$kernel_dir/$modules" "$kernel_dir/root"
          echo "HONK_CI_KERNEL_IMAGE=$kernel_dir/root/boot/vmlinuz-6.12.0-061200-generic" >> "$GITHUB_ENV"
      - name: Run all real-kernel gates on Linux 6.12
        run: |
          vng -r "$HONK_CI_KERNEL_IMAGE" \
            --user root \
            --rwdir "$GITHUB_WORKSPACE" \
            --cpus 2 \
            --memory 4G \
            -- \
            env \
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              RUST_BACKTRACE=1 \
              HONK_ROUTING_TEST_OBJECT="$GITHUB_WORKSPACE/target/honk-ebpf-routing-test/bpfel-unknown-none/release/honk-ebpf" \
              bash "$GITHUB_WORKSPACE/.github/ci/ebpf-vm-tests.sh"

  review-bot:
    name: mechanical PR review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const paths = files.map((f) => f.filename);
            const crates = new Set(
              paths
                .filter((p) => p.startsWith("crates/"))
                .map((p) => p.split("/")[1]),
            );

            const warnings = [];
            const notes = [];

            // AGENTS.md invariant: honk-ebpf-common layout changes must move
            // together with the eBPF program and the userspace map writers.
            const has = (prefix) => paths.some((p) => p.startsWith(prefix));
            if (
              has("crates/honk-ebpf-common/") &&
              !has("crates/honk-ebpf/") &&
              !has("crates/honk-core/src/ebpf/")
            ) {
              warnings.push(
                "`crates/honk-ebpf-common` changed without matching changes in `crates/honk-ebpf` or `crates/honk-core/src/ebpf` — shared kernel/userspace layouts must move together.",
              );
            }
            if (has(".github/workflows/")) {
              notes.push("CI workflow files changed.");
            }
            if (crates.size > 0 && !has("AGENTS.md")) {
              notes.push(
                "Code changed but `AGENTS.md` was not updated — check whether any documented behavior/convention changed.",
              );
            }

            const additions = files.reduce((s, f) => s + f.additions, 0);
            const deletions = files.reduce((s, f) => s + f.deletions, 0);
            const lines = [
              `**mechanical review** (bot)`,
              ``,
              `Files: ${paths.length} (+${additions}/-${deletions})` +
                (crates.size
                  ? ` · crates: ${[...crates].map((c) => `\`${c}\``).join(", ")}`
                  : ""),
            ];
            for (const w of warnings) lines.push(`- ⚠️ ${w}`);
            for (const n of notes) lines.push(`- ℹ️ ${n}`);
            if (!warnings.length && !notes.length) {
              lines.push("", "No structural issues detected.");
            }

            const body = lines.join("\n");
            await core.summary.addRaw(body).write();

            // A pull_request run from a fork gets a read-only token whatever
            // `permissions:` asks for, so commenting there fails the job and
            // hides the review that was just written to the step summary.
            const head = pr.head.repo?.full_name;
            if (head !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info("fork pull request: review written to the step summary");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
