      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          key: ${{ github.job }}-${{ steps.toolchain.outputs.stable }}-${{ steps.toolchain.outputs.ebpf }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            crates/honk-ebpf -> target
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev clang llvm zstd
      - name: Read bpf-linker cache key
        id: linker-pin
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          echo "sha256=$BPF_LINKER_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bpf-linker
          key: bpf-linker-${{ github.job }}-${{ steps.linker-pin.outputs.sha256 }}
      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          archive="$RUNNER_TEMP/bpf-linker/bpf-linker.tar.zst"
          mkdir -p "$(dirname "$archive")"
          if ! test -f "$archive"; then
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          fi
          echo "$BPF_LINKER_SHA256  $archive" | sha256sum -c -
          zstd -dc "$archive" | tar -xf - -C "$CARGO_HOME/bin"
          bpf-linker --version
      - name: Prepare eBPF object
        working-directory: crates/honk-ebpf
        env:
          EBPF_TOOLCHAIN: ${{ steps.toolchain.outputs.ebpf }}
        run: |
          set -euo pipefail
          cargo build --release -Zbuild-std=core --target bpfel-unknown-none
          readelf -S target/bpfel-unknown-none/release/honk-ebpf | grep '\.BTF'
          # build.rs requires the compiler identity as well as source freshness.
          printf '%s' "$EBPF_TOOLCHAIN" > target/bpfel-unknown-none/release/honk-ebpf.toolchain
      - run: cargo check -p honk-core --no-default-features
      - run: cargo check -p honk-core --no-default-features --features clash-api
      - run: cargo check -p honk-core --no-default-features --features ebpf
      - run: cargo check -p honk-tool
      - name: Test outbound without rprx
