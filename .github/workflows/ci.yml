name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ebpf:
        description: Run the floor-kernel eBPF gate
        type: boolean
        default: true
      full:
        description: Run all lanes
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ebpf: ${{ steps.filter.outputs.ebpf }}
      parser: ${{ steps.filter.outputs.parser }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      ebpf_label: ${{ contains(github.event.pull_request.labels.*.name, 'ci:ebpf') }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'tools/dae-parse/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'config.dae'
              - 'config.min.dae'
              - 'example.dae'
              - 'ci/**'
              - '.github/ci/**'
              - '.github/workflows/**'
              - 'Justfile'
              - '.config/**'
              - '.cargo/**'
              - 'rust-toolchain*'
            docs:
              - '*.md'
              - '.agents/**'
              - 'doc/**'
            parser:
              - 'crates/honk-config/**'
              - 'tools/dae-parse/**'
              - 'fuzz/**'
              - 'doc/en/reference/dialect.md'
              - 'doc/zh/reference/dialect.md'
              - 'example.dae'
              - 'config.dae'
              - 'config.min.dae'
              - 'doc/**/*.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/ci/pins.env'
              - 'Justfile'
              - '.github/workflows/ci.yml'
            ebpf:
              - 'crates/honk-ebpf*/**'
              - 'crates/honk-core/src/ebpf/**'
              - 'crates/honk-core/src/control/routing_matcher/**'
              - 'crates/honk-core/src/control/routing_matcher.rs'
              - 'crates/honk-core/build.rs'
              - 'crates/honk-core/tests/**'
              - 'crates/honk-outbound/src/util.rs'
              - 'crates/honk-outbound/src/proxy/direct.rs'
              - 'crates/honk-outbound/src/proxy/packet/**'
              - 'crates/honk-nfqueue/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/ci/**'
              - '.github/workflows/ci.yml'
      - name: Record lane selection
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const fs = require("node:fs");
            const filters = JSON.parse(process.env.FILTER_OUTPUTS);
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS);
            const labels = (context.payload.pull_request?.labels ?? []).map(label => label.name);
            const pr = context.eventName === "pull_request";
            const push = context.eventName === "push";
            const dispatch = context.eventName === "workflow_dispatch";
            const failed = pr && process.env.FILTER_OUTCOME !== "success";
            const full = labels.includes("ci:full");
            const code = !pr || failed || filters.code === "true" || full;
            const parser = !pr || failed || filters.parser === "true" || full;
            const floor = push || (dispatch && (inputs.ebpf || inputs.full)) ||
              (pr && (failed || filters.ebpf === "true" || labels.includes("ci:ebpf") || full));
            const docs = !pr || failed || filters.code === "true" || filters.docs === "true" || full;
            const lanes = ["changes"];
            if (code) lanes.push("lint", "test", "smoke", "ebpf-check");
            if (parser) lanes.push("parser");
            if (floor) lanes.push("ebpf");
            const heavy = push || (dispatch && inputs.full) || (pr && (failed || full));
            if (heavy) lanes.push("ebpf-recent", "aarch64", "features", "cross-musl");
            if (docs) lanes.push("docs");
            if (pr) lanes.push("review-bot");
            fs.mkdirSync("target/ci-report", { recursive: true });
            fs.writeFileSync("target/ci-report/selection.json", JSON.stringify({
              event: context.eventName, inputs, labels,
              filters: { code: filters.code ?? null, docs: filters.docs ?? null, ebpf: filters.ebpf ?? null, parser: filters.parser ?? null },
              filter_outcome: process.env.FILTER_OUTCOME,
              intended_lanes: lanes, run_id: context.runId, run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            }, null, 2) + "\n");
      - name: Upload lane selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-selection
          path: target/ci-report/selection.json
          retention-days: 30
          if-no-files-found: error

  parser:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.parser == 'true' || needs.changes.outputs.full == 'true') }}
    name: dae-config parser (conformance + fuzz replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: parser
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/dae-parse/go.mod
          cache-dependency-path: tools/dae-parse/go.sum
      - name: Build dae oracle
        working-directory: tools/dae-parse
        run: |
          go build -o "$RUNNER_TEMP/dae-parse" .
          "$RUNNER_TEMP/dae-parse" -version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-src
          key: conformance-src-${{ hashFiles('crates/honk-config/conformance/manifest.toml') }}
      - name: Fetch and verify pinned dae sources
        run: python3 tools/dae-parse/fetch.py "$RUNNER_TEMP/conformance-src"
      - name: Compare parser conformance
        env:
          DAE_PARSE_BIN: ${{ runner.temp }}/dae-parse
          CONFORMANCE_SRC: ${{ runner.temp }}/conformance-src
          CONFORMANCE_RESULT: ${{ runner.temp }}/conformance-result.json
        run: cargo test -p honk-config --features conformance --test conformance -- --nocapture
      - name: Replay saved inputs on stable
        if: ${{ !cancelled() }}
        env:
          FUZZ_REPLAY_RESULT: ${{ runner.temp }}/fuzz-replay-result.json
        run: env -u DAE_PARSE_BIN cargo test -p honk-config --features fuzz-checks --test fuzz_replay -- --nocapture
      - name: Write parser CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        with:
          script: |
            const fs = require("node:fs");
            const read = name => {
              try { return JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`, "utf8")); }
              catch { return null; }
            };
            const conformance = read("conformance-result");
            const replay = read("fuzz-replay-result");
            const bounded = text => Buffer.from(String(text).replace(/```/g, "'''")).subarray(0, 280).toString("utf8");
            const counts = conformance && Object.fromEntries(
              ["total", "equal", "bounded", "rejected_as_expected"].map(key => [key, conformance[key]]));
            let failure = null;
            if (conformance?.failure) {
              failure = {summary: bounded(`parser case ${conformance.failure.case}`),
                detail_lines: [bounded(conformance.failure.path), bounded(conformance.failure.detail)]};
            } else if (replay?.failure) {
              failure = {summary: "parser fuzz replay failed",
                detail_lines: [bounded(replay.failure.path), bounded(replay.failure.detail)]};
            } else if (!conformance || !replay) {
              failure = {summary: "parser lane missing conformance or replay results; see job steps", detail_lines: []};
            } else if (process.env.JOB_STATUS !== "success") {
              failure = {summary: bounded(`parser lane ${process.env.JOB_STATUS}; see job steps`), detail_lines: []};
            }
            const observation = (value, unit, reason) => value === null
              ? {value: null, unit, available: false, reason}
              : {value, unit, available: true};
            fs.mkdirSync("target/ci-report", {recursive: true});
            fs.writeFileSync("target/ci-report/parser.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "parser",
              matrix: {target: "x86_64-unknown-linux-gnu", toolchain: process.env.TOOLCHAIN},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null,
              units: {conformance_cases: "cases", fuzz_replay_inputs: "inputs"},
              values: {
                conformance_cases: observation(counts, "cases", "conformance did not produce a result"),
                fuzz_replay_inputs: observation(replay?.inputs ?? null, "inputs", "replay did not produce a result"),
              },
              signals: [], failure,
            }, null, 2) + "\n");
            if (failure) core.setFailed(failure.summary);
      - name: Upload parser CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-parser
          path: target/ci-report/parser.json
          retention-days: 30
          if-no-files-found: error

  docs:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --hidden '*.md' '.agents/**/*.md' 'doc/**/*.md'
          fail: true

  lint:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.full == 'true') }}
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          set -euo pipefail
          # The runner image ships Chrome and Microsoft apt sources; a Hash Sum mismatch
          # at either fails apt-get update, and the jobs install nothing from them.
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all --all-targets -- -D warnings
      - name: Write lint CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        with:
          script: |
            const fs = require("node:fs");
            const cp = require("node:child_process");
            fs.mkdirSync("target/ci-report", {recursive: true});
            let rustc = null;
            try { rustc = cp.execFileSync("rustc", ["-V"], {encoding: "utf8"}).trim(); } catch {}
            const cache = process.env.CACHE_HIT === "true" ? true :
              process.env.CACHE_HIT === "false" ? false : null;
            const values = {};
            const units = {};
            if (rustc) {
              units.toolchain = "rustc-cache";
              values.toolchain = {value: {rustc, cache_hit: cache}, unit: "rustc-cache", available: true};
            }
            const status = process.env.JOB_STATUS;
            fs.writeFileSync("target/ci-report/lint.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "lint",
              matrix: {target: "x86_64-unknown-linux-gnu", toolchain: process.env.TOOLCHAIN},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null, units, values, signals: [],
              failure: status === "success" ? null : {summary: `lint lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload lint CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-lint
          path: target/ci-report/lint.json
          retention-days: 30
          if-no-files-found: error

  test:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.full == 'true') }}
    name: cargo nextest (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: nextest
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          set -euo pipefail
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev

      # routing::tests::test_geosite_* need geo assets (locally found at
      # /etc/dae/geosite.dat; the runner has none).
      - name: Read geo cache key
        id: geo-pins
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          echo "key=$GEOSITE_SHA256-$GEOIP_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geo-assets
          key: geo-${{ steps.geo-pins.outputs.key }}
      - name: Install geo assets for the geosite tests
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          geo_dir="$RUNNER_TEMP/geo-assets"
          mkdir -p "$geo_dir"
          if ! test -f "$geo_dir/geosite.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geosite.dat" \
              "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_TAG/dlc.dat"
          fi
          if ! test -f "$geo_dir/geoip.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geoip.dat" \
              "https://github.com/v2fly/geoip/releases/download/$GEOIP_TAG/geoip.dat"
          fi
          echo "$GEOSITE_SHA256  $geo_dir/geosite.dat" | sha256sum -c -
          echo "$GEOIP_SHA256  $geo_dir/geoip.dat" | sha256sum -c -
          sudo install -D -m 0644 "$geo_dir/geosite.dat" /etc/dae/geosite.dat
          sudo install -D -m 0644 "$geo_dir/geoip.dat" /etc/dae/geoip.dat
      - name: List workspace tests
        run: |
          set -euo pipefail
          mkdir -p target/ci-report
          cargo nextest list --workspace --profile ci --message-format json \
            > target/ci-report/nextest-list.json
      - run: cargo nextest run --workspace --profile ci
      - name: Upload workspace JUnit
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-junit
          path: target/nextest/ci/junit.xml
      - name: Write test CI report
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          values = {}
          units = {}

          def unavailable(name, unit, reason):
              units[name] = unit
              values[name] = {"value": None, "unit": unit, "available": False, "reason": reason}

          try:
              listing = json.loads(Path("target/ci-report/nextest-list.json").read_text())
              names = []
              ignored = 0
              for suite in listing.get("rust-suites", {}).values():
                  for name, case in suite.get("testcases", {}).items():
                      names.append(name)
                      ignored += int(case.get("ignored") is True)
              units["test_inventory"] = "test-names"
              values["test_inventory"] = {
                  "value": {"total": len(names), "names": names},
                  "unit": "test-names", "available": True,
              }
              units["ignored_tests"] = "tests"
              values["ignored_tests"] = {"value": ignored, "unit": "tests", "available": True}
          except (OSError, TypeError, ValueError):
              unavailable("test_inventory", "test-names", "nextest list is unavailable")
              unavailable("ignored_tests", "tests", "nextest list is unavailable")

          try:
              cases = list(ET.parse("target/nextest/ci/junit.xml").iter("testcase"))
              slowest = max(cases, key=lambda case: float(case.get("time", "0")))
              name = slowest.get("name", "unknown")
              class_name = slowest.get("classname")
              if class_name and not name.startswith(class_name):
                  name = f"{class_name}::{name}"
              units["slowest_test"] = "seconds"
              values["slowest_test"] = {
                  "value": {"name": name, "seconds": float(slowest.get("time", "0"))},
                  "unit": "seconds", "available": True,
              }
          except (OSError, TypeError, ValueError, ET.ParseError):
              unavailable("slowest_test", "seconds", "nextest JUnit is unavailable")

          try:
              rustc = subprocess.run(
                  ["rustc", "-V"], check=True, capture_output=True, text=True,
              ).stdout.strip()
              raw_cache = os.environ.get("CACHE_HIT")
              cache_hit = True if raw_cache == "true" else False if raw_cache == "false" else None
              units["toolchain"] = "rustc-cache"
              values["toolchain"] = {
                  "value": {"rustc": rustc, "cache_hit": cache_hit},
                  "unit": "rustc-cache", "available": True,
              }
          except (OSError, subprocess.CalledProcessError):
              unavailable("toolchain", "rustc-cache", "rustc is unavailable")

          status = os.environ["JOB_STATUS"]
          report = {
              "schema_version": 1,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "lane": "test",
              "matrix": {
                  "target": "x86_64-unknown-linux-gnu",
                  "toolchain": os.environ["TOOLCHAIN"],
              },
              "measured_sha": os.environ["MEASURED_SHA"],
              "baseline_sha": None,
              "units": units,
              "values": values,
              "signals": [],
              "failure": None if status == "success" else {
                  "summary": f"test lane {status}", "detail_lines": [],
              },
          }
          Path("target/ci-report/test.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Upload test CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-test
          path: target/ci-report/test.json
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: DNS smoke (release honk-core)
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install boring-sys build deps (cmake + libclang for bindgen)
        run: |
          set -euo pipefail
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev
      # The shipping profile (opt-level s, fat LTO): the smoke measures the
      # binary users run, and every code PR now proves that profile builds.
      - run: cargo build --release -p honk-core --bin honk-core
      - name: Run DNS smoke
        env:
          HONK_CORE_BIN: target/release/honk-core
          HONK_SMOKE_REPORT: target/ci-report/dns-smoke.json
        run: |
          set -euo pipefail
          mkdir -p target/ci-report
          python3 ci/dns-smoke.py
      - name: Write smoke CI report
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          HONK_CORE_BIN: target/release/honk-core
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        run: |
          set -euo pipefail
          mkdir -p target/ci-report
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          values = {}
          units = {}

          def unavailable(name, unit, reason):
              units[name] = unit
              values[name] = {"value": None, "unit": unit, "available": False, "reason": reason}

          try:
              smoke = json.loads(Path("target/ci-report/dns-smoke.json").read_text())
              units["dns_smoke"] = "queries-and-names"
              values["dns_smoke"] = {
                  "value": {"queries": smoke["queries"], "upstream_names": smoke["upstream_names"]},
                  "unit": "queries-and-names", "available": True,
              }
              units["smoke_memory"] = "MiB"
              values["smoke_memory"] = {
                  "value": smoke["vmhwm_kib"] / 1024, "unit": "MiB", "available": True,
              }
              units["smoke_cpu"] = "seconds"
              values["smoke_cpu"] = {
                  "value": smoke["cpu_seconds"], "unit": "seconds", "available": True,
              }
          except (KeyError, OSError, TypeError, ValueError):
              unavailable("dns_smoke", "queries-and-names", "DNS smoke report is unavailable")
              unavailable("smoke_memory", "MiB", "DNS smoke report is unavailable")
              unavailable("smoke_cpu", "seconds", "DNS smoke report is unavailable")

          try:
              units["binary_size"] = "bytes"
              values["binary_size"] = {
                  "value": os.stat(os.environ["HONK_CORE_BIN"]).st_size, "unit": "bytes", "available": True,
              }
          except OSError:
              unavailable("binary_size", "bytes", "release honk-core is unavailable")

          try:
              rustc = subprocess.run(
                  ["rustc", "-V"], check=True, capture_output=True, text=True,
              ).stdout.strip()
              raw_cache = os.environ.get("CACHE_HIT")
              cache_hit = True if raw_cache == "true" else False if raw_cache == "false" else None
              units["toolchain"] = "rustc-cache"
              values["toolchain"] = {
                  "value": {"rustc": rustc, "cache_hit": cache_hit},
                  "unit": "rustc-cache", "available": True,
              }
          except (OSError, subprocess.CalledProcessError):
              unavailable("toolchain", "rustc-cache", "rustc is unavailable")

          status = os.environ["JOB_STATUS"]
          report = {
              "schema_version": 1,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "lane": "smoke",
              "matrix": {
                  "target": "x86_64-unknown-linux-gnu",
                  "toolchain": os.environ["TOOLCHAIN"],
                  "profile": "release",
              },
              "measured_sha": os.environ["MEASURED_SHA"],
              "baseline_sha": None,
              "units": units,
              "values": values,
              "signals": [],
              "failure": None if status == "success" else {
                  "summary": f"smoke lane {status}", "detail_lines": [],
              },
          }
          Path("target/ci-report/smoke.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Upload smoke CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-smoke
          path: target/ci-report/smoke.json
          retention-days: 30
          if-no-files-found: error

  ebpf:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.ebpf || inputs.full)) || (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.ebpf == 'true' || needs.changes.outputs.ebpf_label == 'true' || needs.changes.outputs.full == 'true'))) }}
    name: eBPF object + real VM kernel tests
    # These tests attach TC/cgroup programs and therefore cannot run in a job container.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchains
        id: toolchain
        run: |
          set -euo pipefail
          echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: |
            . -> target
            crates/honk-ebpf -> target
          cache-directories: target/honk-ebpf-routing-test
      - name: Install build and VM dependencies
        run: |
          set -euo pipefail
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo grep -lE 'dl\.google\.com|packages\.microsoft\.com' /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            busybox-static clang cmake coreutils file iproute2 iptables jq kbd kmod \
            libbpf-dev libclang-dev libvirt-clients llvm pkg-config python3-argcomplete \
            python3-requests python3-venv qemu-kvm rsync udev util-linux virtiofsd zstd
      - name: Configure KVM
        run: |
          set -euo pipefail
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
            if test -r /dev/kvm -a -w /dev/kvm; then
              echo "HONK_CI_VNG_DISABLE_KVM=0" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "KVM unavailable on this runner; using virtme-ng software emulation"
          echo "HONK_CI_VNG_DISABLE_KVM=1" >> "$GITHUB_ENV"
      - name: Install pinned virtme-ng
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          wheel="$RUNNER_TEMP/${VIRTME_NG_WHEEL_URL##*/}"
          curl -fsSL --retry 3 --retry-all-errors -o "$wheel" "$VIRTME_NG_WHEEL_URL"
          echo "$VIRTME_NG_SHA256  $wheel" | sha256sum -c -
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/virtme-ng"
          "$RUNNER_TEMP/virtme-ng/bin/pip" --disable-pip-version-check install --no-deps \
            "$wheel"
          echo "$RUNNER_TEMP/virtme-ng/bin" >> "$GITHUB_PATH"
      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$CARGO_HOME/bin"
          bpf-linker --version
      - name: Read download cache keys
        id: pins
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          echo "geo=$GEOSITE_SHA256-$GEOIP_SHA256" >> "$GITHUB_OUTPUT"
          echo "kernel=$KERNEL_FLOOR_IMAGE_SHA256-$KERNEL_FLOOR_MODULES_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geo-assets
          key: geo-${{ steps.pins.outputs.geo }}
      - name: Install geo assets for eBPF-feature unit tests
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          geo_dir="$RUNNER_TEMP/geo-assets"
          mkdir -p "$geo_dir"
          if ! test -f "$geo_dir/geosite.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geosite.dat" \
              "https://github.com/v2fly/domain-list-community/releases/download/$GEOSITE_TAG/dlc.dat"
          fi
          if ! test -f "$geo_dir/geoip.dat"; then
            curl -fsSL --retry 3 -o "$geo_dir/geoip.dat" \
              "https://github.com/v2fly/geoip/releases/download/$GEOIP_TAG/geoip.dat"
          fi
          echo "$GEOSITE_SHA256  $geo_dir/geosite.dat" | sha256sum -c -
          echo "$GEOIP_SHA256  $geo_dir/geoip.dat" | sha256sum -c -
          sudo install -D -m 0644 "$geo_dir/geosite.dat" /etc/dae/geosite.dat
          sudo install -D -m 0644 "$geo_dir/geoip.dat" /etc/dae/geoip.dat
      - name: Build eBPF object
        run: |
          set -euo pipefail
          cd crates/honk-ebpf
          cargo build --release -Zbuild-std=core --target bpfel-unknown-none
      - name: Build routing-test eBPF object separately
        run: |
          set -euo pipefail
          cd crates/honk-ebpf
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/honk-ebpf-routing-test" \
            cargo build --release --features routing-test \
              -Zbuild-std=core --target bpfel-unknown-none
      # aya refuses objects without BTF ("no BTF parsed for object") — fail
      # here instead of at runtime on a gateway.
      - name: Verify eBPF objects have BTF
        run: |
          set -euo pipefail
          readelf -S crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'
          readelf -S target/honk-ebpf-routing-test/bpfel-unknown-none/release/honk-ebpf | grep -q '\.BTF'
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: nextest
      - name: Run eBPF-feature unit tests
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo nextest run -p honk-core --features ebpf --lib --profile ci
      - name: Upload eBPF unit-test JUnit
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpf-unit-junit
          path: target/nextest/ci/junit.xml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kernel-floor/*.deb
          key: kernel-floor-${{ steps.pins.outputs.kernel }}
      - name: Run all real-kernel gates on Linux 6.12
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: .github/ci/run-vm-gate.sh floor
      - name: Upload guest output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-tests-floor
          path: target/vm-tests/floor
      - name: Write floor-VM CI report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          JOB_STATUS: ${{ job.status }}
          MEASURED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.stable }}
        with:
          script: |
            const fs = require("node:fs");
            const cp = require("node:child_process");
            fs.mkdirSync("target/ci-report", {recursive: true});
            const values = {};
            const units = {};
            try {
              const rustc = cp.execFileSync("rustc", ["-V"], {encoding: "utf8"}).trim();
              const raw = process.env.CACHE_HIT;
              const cache = raw === "true" ? true : raw === "false" ? false : null;
              units.toolchain = "rustc-cache";
              values.toolchain = {value: {rustc, cache_hit: cache}, unit: "rustc-cache", available: true};
            } catch {}
            try {
              const summary = fs.readFileSync("target/vm-tests/floor/summary.md", "utf8");
              const kernel = summary.match(/^Guest uname -r: (.+)$/m)?.[1];
              if (kernel) {
                units.vm_environment = "kernel-accelerator";
                values.vm_environment = {
                  value: {kernel, accelerator: process.env.HONK_CI_VNG_DISABLE_KVM === "1" ? "TCG" : "KVM"},
                  unit: "kernel-accelerator", available: true,
                };
              }
            } catch {}
            const status = process.env.JOB_STATUS;
            fs.writeFileSync("target/ci-report/ebpf.json", JSON.stringify({
              schema_version: 1, run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT), lane: "ebpf",
              matrix: {target: "x86_64-unknown-linux-gnu", toolchain: process.env.TOOLCHAIN, kernel: "floor"},
              measured_sha: process.env.MEASURED_SHA, baseline_sha: null, units, values, signals: [],
              failure: status === "success" ? null : {summary: `ebpf lane ${status}`, detail_lines: []},
            }, null, 2) + "\n");
      - name: Upload floor-VM CI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-ebpf
          path: target/ci-report/ebpf.json
          retention-days: 30
          if-no-files-found: error

